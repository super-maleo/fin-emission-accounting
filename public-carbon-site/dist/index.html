<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deloitte 碳排放管理系统 · 交互增强版</title>
  <style>
:root{
  --green:#86BC25;--green2:#6EA51E;--green3:#4D7F17;--greenLight:#F0F8E7;--greenSoft:#F8FCF3;
  --black:#000;--text:#1F2937;--sub:#667085;--line:#E5E7EB;--bg:#F6F8F5;--white:#fff;
  --blue:#2C6AA0;--teal:#008A7A;--orange:#E9A23B;--red:#D64545;--purple:#6750A4;
  --shadow:0 10px 26px rgba(16,24,40,.07)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);font-size:14px}
button,input,select,textarea{font-family:inherit}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900;color:#000;margin-right:30px;letter-spacing:-1px}
.logo:after{content:".";color:var(--green);font-size:34px;line-height:0}
.nav{display:flex;align-items:center;gap:2px;flex:1;height:64px}
.nav button{height:64px;background:transparent;border:0;border-bottom:3px solid transparent;padding:0 16px;font-size:15px;cursor:pointer;color:#2F3A45}
.nav button.active{border-bottom-color:var(--green);font-weight:800;color:#000}
.right{display:flex;align-items:center;gap:10px;color:#344054}
.right .pill{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;display:flex;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--greenLight);color:var(--green3);font-weight:800;display:flex;align-items:center;justify-content:center}
.main{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:276px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side-title{font-size:12px;color:#98A2B3;letter-spacing:.06em;margin:6px 10px 12px}
.group{margin-bottom:8px}
.group-btn{width:100%;min-height:42px;text-align:left;border:0;background:#fff;border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:800;color:#24313D}
.group-btn:hover{background:#F7FAF4}
.group-btn.active{background:var(--greenLight);color:var(--green3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(134,188,37,.14);flex:0 0 auto}
.sub{margin:4px 0 10px 28px;border-left:1px solid #E5EFD6;padding-left:9px}
.sub button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:8px;color:#5B6673;cursor:pointer;font-size:13px}
.sub button:hover{background:#F7FAF4;color:#1F2937}
.sub button.active{background:var(--greenLight);color:var(--green3);font-weight:800}
.content{flex:1;padding:22px 26px 36px;overflow:auto}
.breadcrumb{font-size:13px;color:#798390;margin-bottom:8px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
h1{font-size:24px;margin:0 0 7px;color:#101828}
.desc{margin:0;color:#667085;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;color:#344054}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.soft{background:var(--greenLight);border-color:#D4E9B6;color:var(--green3)}
.btn.red{background:#FFF5F5;border-color:#F2C9C9;color:var(--red)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(160px,1fr));margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px}
.kpi{position:relative;overflow:hidden;min-height:118px}
.kpi:after{content:"";position:absolute;right:-24px;top:-28px;width:94px;height:94px;border-radius:50%;background:rgba(134,188,37,.13)}
.kpi .label{font-size:13px;color:#667085;margin-bottom:10px}
.kpi .value{font-size:26px;font-weight:900;color:#101828}
.kpi .note{font-size:12px;color:#667085;margin-top:8px}
.two{grid-template-columns:1.25fr .9fr}.twoEqual{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.card h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#101828}
.card h3:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--green)}
.filters{display:grid;grid-template-columns:repeat(4,1fr) auto auto;gap:10px;align-items:end}
.field label{display:block;font-size:12px;color:#667085;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid #D6DCE2;border-radius:8px;padding:0 10px;background:#fff}
.field textarea{height:76px;padding:10px;resize:none}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:#5B6673;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{color:var(--green3);border-bottom-color:var(--green);font-weight:800}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#F6FAEF;color:#405124;font-size:13px;font-weight:900}
tr:hover td{background:#FBFDF8}
.tableWrap{overflow:auto}
.status{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}
.ok{background:#EAF7E5;color:#3F7F16}.warn{background:#FFF7E6;color:#B7791F}.bad{background:#FFF1F1;color:#C53030}.info{background:#EAF4FF;color:#2C6AA0}.gray{background:#F2F4F7;color:#475467}
.progress{height:8px;background:#EAECF0;border-radius:99px;overflow:hidden;min-width:120px}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}
.bars{height:210px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:13px;padding:16px 8px 0}.bar{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#B7D779,#86BC25);position:relative}.bar b{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:12px;color:#667085}.xlabels{display:flex;gap:13px;padding:8px;color:#667085;font-size:12px;text-align:center}.xlabels span{flex:1}
.donutWrap{display:flex;gap:18px;align-items:center}.donut{width:152px;height:152px;border-radius:50%;background:conic-gradient(var(--green) 0 42%,var(--teal) 42% 65%,var(--blue) 65% 84%,#CBD5E1 84% 100%);position:relative}.donut:after{content:"";position:absolute;inset:28px;border-radius:50%;background:#fff}
.legend{flex:1;display:grid;gap:8px}.legend div{display:flex;justify-content:space-between;border-bottom:1px dashed #E5E7EB;padding-bottom:7px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px}.step:before{content:attr(data-n);display:flex;width:28px;height:28px;background:var(--green);color:#fff;border-radius:50%;align-items:center;justify-content:center;font-weight:900;margin-bottom:8px}.step h4{margin:0 0 7px}.step p{margin:0;color:#667085;font-size:13px;line-height:1.45}
.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.full{grid-column:1/-1}
.treeLayout{display:grid;grid-template-columns:250px 1fr;gap:16px}.tree{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px}.tree ul{margin:0;padding-left:16px;list-style:none}.tree li{padding:8px 6px;border-radius:7px}.tree li.active{background:var(--greenLight);color:var(--green3);font-weight:900}.canvas{min-height:340px;border:1px dashed #BFD99A;border-radius:12px;background:#FBFDF8;padding:18px}.node{display:inline-flex;border:1px solid #BFD99A;border-radius:12px;background:#fff;padding:10px 14px;margin:10px;font-weight:800}.node.green{background:var(--greenLight);color:var(--green3)}.node.blue{background:#F0F7FF;border-color:#B9D7EF;color:#245B86}.node.teal{background:#EFFAF8;border-color:#AFE0D7;color:#087265}
.sankey{height:245px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(90deg,#FBFDF8,#fff);position:relative;overflow:hidden}.flow{position:absolute;height:32px;border-radius:999px;background:rgba(134,188,37,.28);transform-origin:left center}.f1{left:80px;top:52px;width:440px;transform:rotate(5deg)}.f2{left:88px;top:120px;width:350px;transform:rotate(-8deg);background:rgba(0,138,122,.23)}.f3{left:110px;top:180px;width:300px;background:rgba(44,106,160,.2)}.sLabel{position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-weight:800;box-shadow:var(--shadow)}
.cover{background:linear-gradient(135deg,#fff 0%,#fff 55%,#F0F8E7 55%,#E4F3D0 100%);border:1px solid #DCEBCB;border-radius:16px;min-height:410px;padding:34px;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;right:-100px;bottom:-120px;width:340px;height:340px;border-radius:50%;background:rgba(134,188,37,.22)}.coverLogo{font-size:32px;font-weight:900}.coverLogo:after{content:".";color:var(--green);font-size:42px}.coverTitle{font-size:28px;font-weight:900;margin:58px 0 12px;color:#111827}.coverSub{font-size:16px;color:#4B5563}.coverMeta{position:absolute;left:34px;bottom:30px;color:#667085;line-height:1.8}
.mapGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.map{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:122px}.mapId{font-weight:900;color:var(--green3);font-size:18px;margin-bottom:8px}.mapFunc{font-weight:800;line-height:1.35;margin-bottom:7px}.mapMenu{font-size:12px;color:#667085;line-height:1.45}
.home{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:16px}.hero{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-80px;top:-90px;width:230px;height:230px;border-radius:50%;background:rgba(134,188,37,.14)}.hero h1{font-size:31px;margin:12px 0 10px}.hero p{color:#5B6673;line-height:1.7}.badge{display:inline-flex;background:var(--greenLight);color:var(--green3);border-radius:999px;padding:4px 9px;font-weight:900;font-size:12px}.entryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.entry{border:1px solid #DCEBCB;border-radius:14px;background:#FBFDF8;padding:16px;cursor:pointer}.entry:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.entry h3{margin:0 0 8px}.entry p{margin:0;color:#667085;font-size:13px;line-height:1.5}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#FBFDF8;border:1px solid #E5EED7;border-radius:14px;padding:14px}.mini b{display:block;font-size:22px;margin:8px 0}
.iconGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.iconCard{border:1px solid var(--line);border-radius:13px;background:#fff;padding:14px}.icon{width:34px;height:34px;border-radius:10px;background:var(--greenLight);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green3);margin-bottom:10px}.iconCard b{display:block;margin-bottom:5px}.iconCard span{font-size:12px;color:#667085;line-height:1.45}
.footer{margin-top:18px;text-align:right;color:#98A2B3;font-size:12px}
@media(max-width:1240px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.twoEqual,.home{grid-template-columns:1fr}.mapGrid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.iconGrid{grid-template-columns:repeat(2,1fr)}}

.realSankey{
  width:100%;
  height:360px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fff;
  overflow:hidden;
  position:relative;
}
.realSankey svg{width:100%;height:100%;display:block}
.realSankey .node rect{rx:3;ry:3}
.realSankey .node text{font-size:12px;fill:#344054;font-weight:700}
.realSankey .flowPath{fill:none;stroke-linecap:round;opacity:.62}
.realSankey .flowPath:hover{opacity:.86}
.realSankey .sankeyTip{
  position:absolute;left:300px;top:188px;background:#fff;border:1px solid #E4E7EC;border-radius:8px;
  box-shadow:0 8px 22px rgba(16,24,40,.14);padding:8px 10px;font-size:12px;color:#344054
}
.realSankey .sankeyTip b{color:#101828}


.realSankey{
  width:100%;
  height:390px;
  border:1px solid var(--line);
  border-radius:14px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FBFDF8 100%);
  overflow:hidden;
  position:relative;
}
.realSankey svg{width:100%;height:100%;display:block}
.realSankey .node rect{rx:4;ry:4}
.realSankey .node text{font-size:12px;fill:#344054;font-weight:700}
.realSankey .flowPath{fill:none;stroke-linecap:round;opacity:.50}
.realSankey .flowPath.main{opacity:.64}
.realSankey .flowPath:hover{opacity:.82}
.realSankey .stageTitle{font-size:13px;fill:#667085;font-weight:800}
.realSankey .valueLabel{font-size:11px;fill:#667085;font-weight:700}
.realSankey .captionBox{fill:#fff;stroke:#E5E7EB;stroke-width:1;rx:8;ry:8}
.realSankey .captionText{font-size:12px;fill:#475467;font-weight:700}


.helpHero{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:24px;
  margin-bottom:16px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
  align-items:center;
  position:relative;
  overflow:hidden;
}
.helpHero:after{
  content:"";
  position:absolute;
  right:-90px;
  top:-100px;
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(134,188,37,.13);
}
.helpHero h2{margin:0 0 8px;font-size:26px;color:#101828}
.helpHero p{margin:0 0 16px;color:#667085;line-height:1.65}
.helpSearch{
  height:42px;
  border:1px solid #D6DCE2;
  border-radius:10px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#FBFDF8;
  max-width:560px;
}
.helpSearch span{font-size:18px;margin-right:8px;color:var(--green3)}
.helpSearch input{border:0;outline:none;background:transparent;flex:1;font-size:14px}
.helpHeroPanel{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.helpMini{
  border:1px solid #DCEBCB;
  background:#FBFDF8;
  border-radius:14px;
  padding:14px;
}
.helpMini b{display:block;font-size:22px;margin-bottom:5px;color:#101828}
.helpMini span{font-size:12px;color:#667085}
.helpTileGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px;
}
.helpTile{
  border:1px solid var(--line);
  background:#fff;
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:16px;
  min-height:196px;
  cursor:pointer;
  transition:.16s ease;
  position:relative;
  overflow:hidden;
}
.helpTile:hover{transform:translateY(-2px);border-color:#CFE6AE;box-shadow:0 14px 30px rgba(16,24,40,.10)}
.helpTile svg{
  width:100%;
  height:94px;
  margin-bottom:12px;
  display:block;
  border-radius:12px;
  background:#F8FCF3;
}
.helpTile h3{font-size:16px;margin:0 0 7px;color:#101828}
.helpTile p{margin:0;color:#667085;font-size:13px;line-height:1.5}
.helpTile .openHint{
  position:absolute;
  right:14px;
  bottom:12px;
  color:var(--green3);
  font-weight:900;
  font-size:12px;
}
.helpGuideGrid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:16px;
}
.helpSteps{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.helpStep{
  border:1px solid #E5E7EB;
  border-radius:12px;
  background:#fff;
  padding:13px;
}
.helpStep b{display:block;color:#101828;margin-bottom:6px}
.helpStep span{display:block;color:#667085;font-size:13px;line-height:1.45}
@media(max-width:1240px){
  .helpHero,.helpGuideGrid{grid-template-columns:1fr}
  .helpTileGrid{grid-template-columns:repeat(2,1fr)}
}


.helpContentGrid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:16px;
  margin-top:16px;
}
.helpListCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
  padding:16px;
}
.helpListHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.helpListHead h3{
  margin:0;
  font-size:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.helpListHead h3:before{
  content:"";
  width:4px;
  height:16px;
  background:var(--green);
  border-radius:3px;
}
.helpListHead a{
  color:var(--green3);
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}
.faqList{
  display:grid;
  gap:8px;
}
.faqItem{
  border-bottom:1px solid #EEF2F6;
  padding:10px 0 11px;
  display:grid;
  grid-template-columns:22px 1fr auto;
  gap:8px;
  align-items:start;
  cursor:pointer;
}
.faqItem:hover{
  background:#FBFDF8;
  margin-left:-8px;
  margin-right:-8px;
  padding-left:8px;
  padding-right:8px;
  border-radius:8px;
}
.faqNo{
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--greenLight);
  color:var(--green3);
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:1px;
}
.faqTitle{
  color:#344054;
  font-weight:700;
  line-height:1.45;
}
.faqTag{
  display:inline-flex;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:#F2F4F7;
  color:#667085;
  white-space:nowrap;
}
.standardTabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
  border-bottom:1px solid #EEF2F6;
}
.standardTabs button{
  border:0;
  background:transparent;
  padding:8px 10px;
  color:#667085;
  font-weight:700;
  border-bottom:3px solid transparent;
}
.standardTabs button.active{
  color:var(--green3);
  border-bottom-color:var(--green);
}
.standardList{
  display:grid;
  gap:10px;
}
.standardItem{
  border:1px solid #EEF2F6;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
.standardItem:hover{
  border-color:#CFE6AE;
  background:#FBFDF8;
}
.standardItem b{
  display:block;
  margin-bottom:6px;
  color:#101828;
}
.standardItem span{
  display:block;
  color:#667085;
  font-size:12px;
  line-height:1.45;
}
.standardItem .arrow{
  color:var(--green3);
  font-weight:900;
  align-self:center;
}
.messagePanel{
  display:grid;
  gap:10px;
}
.messageItem{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:start;
  border-bottom:1px solid #EEF2F6;
  padding:10px 0;
  cursor:pointer;
}
.messageIcon{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#F0F8E7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green3);
  font-weight:900;
}
.messageItem b{
  display:block;
  color:#101828;
  margin-bottom:5px;
}
.messageItem span{
  display:block;
  color:#667085;
  font-size:12px;
  line-height:1.45;
}
.messageTime{
  color:#98A2B3;
  font-size:12px;
  white-space:nowrap;
}
@media(max-width:1240px){
  .helpContentGrid{grid-template-columns:1fr}
}


.supplyBoardGrid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:16px;
  align-items:start;
}
.horizontalChart{
  display:grid;
  gap:10px;
  margin-top:6px;
}
.hbarRow{
  display:grid;
  grid-template-columns:92px 1fr 46px;
  gap:10px;
  align-items:center;
}
.hbarLabel{
  color:#475467;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hbarTrack{
  height:12px;
  background:#EEF2F6;
  border-radius:999px;
  overflow:hidden;
  position:relative;
}
.hbarFill{
  height:100%;

return `<div class="card"><h3>${title}</h3><div class="tableWrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join("")}${hasAction?"":"<th>操作</th>"}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td>${hasAction&&i===r.length-1&&actionLabels.includes(String(c))?`<button class="btn">${c}</button>`:status(c)}</td>`).join("")}${hasAction?"":`<td><button class="btn">查看</button> <button class="btn">编辑</button> <button class="btn red">删除</button></td>`}</tr>`).join("")}</tbody></table></div></div>`;

async function api(path,options={}){
const res=await fetch(path,{headers:{"Content-Type":"application/json"},...options});
const data=await res.json();
if(!res.ok||data.error)throw new Error(data.error||`HTTP ${res.status}`);
return data;
}

async function saveFactor(){
const v=id=>document.getElementById(id).value;
await api("/api/factors",{method:"POST",body:JSON.stringify({category_code:v("factorCategory"),name:v("factorName"),unit:v("factorUnit"),gas:v("factorGas"),factor_value:v("factorValue"),source_type:v("factorSourceType")})});
await loadBackendData();render();showToast("排放因子已写入 演示存储");
}

function demoCalculate(standardCode, org, period) {
  const standard = demo.standards.find(row => row.code === standardCode);
  const matches = row => (!org || row.org === org) && (!period || row.period === period);
  const detail = demo.records.filter(matches).flatMap(row => {
    const factor = demo.factors.find(item => item.id === row.factor_id);
    const gwp = demo.gwp.find(item => item.standard_code === standardCode && item.gas === row.gas && Number(item.horizon) === 100);
    if (!factor || !gwp) return [];
    return [{...row, factor_value: factor.factor_value, gwp_value: gwp.value,
      standard_adjustment: standard.adjustment, emission_tco2e: row.activity_value * factor.factor_value * gwp.value * standard.adjustment}];
  });
  if (matches({org: demoOrg, period: demoPeriod})) {
    detail.push(...supplyScope3Items.filter(row => row.status === "已收集").map(row => ({
      org: demoOrg, period: demoPeriod, category_code: row.category, source_name: row.supplier + " / " + row.part,
      activity_value: row.qty, activity_unit: row.unit, factor_value: row.unitCarbon / 1000,
      gwp_value: 1, standard_adjustment: 1, emission_tco2e: row.total
    })));
  }
  const total_emission = detail.reduce((sum, row) => sum + row.emission_tco2e, 0);
  const categories = demo.categories.flatMap(category => {
    const rows = detail.filter(row => row.category_code === category.code);
    if (!rows.length) return [];
    const emission_tco2e = rows.reduce((sum, row) => sum + row.emission_tco2e, 0);
    return [{category_code: category.code, category_name: category.name,
      emission_tco2e: +emission_tco2e.toFixed(4), share: total_emission ? +(emission_tco2e / total_emission * 100).toFixed(2) : 0}];
  });
  return {standard, total_emission: +total_emission.toFixed(4), categories, detail};
}

  const url = new URL(path, "https://demo.invalid");
  const name = url.pathname.split("/").pop();
  if (name === "bootstrap") return demo;
  if (name === "calculate") {
    return demoCalculate(url.searchParams.get("standard"), url.searchParams.get("org"), url.searchParams.get("period"));
  }
  const row = JSON.parse(options.body || "{}");
  const collection = demo[name];
  if (options.method !== "POST" || !Array.isArray(collection)) throw new Error("演示操作不可用");
  let report;
  if (name === "records") {
    const source = demo.sources.find(item => item.id === row.source_id);
    if (!source || !String(row.activity_value).trim() || !Number.isFinite(+row.activity_value) || +row.activity_value < 0) {
      throw new Error("请选择排放源并填写有效的活动数据");
    }
    Object.assign(row, {factor_id: source.default_factor_id, source_name: source.name, activity_value: +row.activity_value});
  }
  if (name === "reports") {
    report = demoCalculate(row.standard_code, row.org, row.period);
    row.total_emission = report.total_emission;
    row.content_json = JSON.stringify(report);
  }
  if (name === "formulas") row.enabled = 1;
  if (name === "factors") row.year = 2026;
  const existing = name === "substances" && collection.find(item => item.gas === row.gas);
  row.id = existing ? existing.id : Math.max(0, ...collection.map(item => item.id)) + 1;
  row.created_at = new Date().toISOString();
  if (existing) Object.assign(existing, row);
  else collection.unshift(row);
  persistDemo();
  return {ok: true, id: row.id, report};
};

  activeLcaId ||= demo.lcaModels[0].id;
}
function activeLca() {
  return demo.lcaModels.find(model=>model.id===activeLcaId) || demo.lcaModels[0];
}
function lineEmission(model,line) {
  return Number(line.quantity) * Number(line.factor) * Number(line.allocation) / 100 / model.batchOutput * model.referenceFlow;
}
function lcaTotals(model) {
  return model.stages.map(stage=>({
    name:stage.name, enabled:stage.enabled,
    total:stage.enabled ? stage.lines.reduce((sum,line)=>sum+lineEmission(model,line),0) : 0
  }));
}
function lcaTotal(model) {
  return lcaTotals(model).reduce((sum,stage)=>sum+stage.total,0);
}

function saveLcaModel() {
  const numeric=["referenceFlow","batchOutput","lifetime","annualHours","power"];

    lcaDraft[input.dataset.lcaModel]=numeric.includes(input.dataset.lcaModel)?Number(input.value):input.value.trim();
  });
  if (!lcaDraft.name || !lcaDraft.code || !lcaDraft.functionalUnit || lcaDraft.batchOutput<=0 || lcaDraft.referenceFlow<=0 ||
      numeric.some(key=>!Number.isFinite(lcaDraft[key])||lcaDraft[key]<0)) {

  const useLine=lcaDraft.stages[3].lines.find(line=>line.name.startsWith("运行用电"));
  if(useLine) {

function recordLcaVersion() {

function exportLca() {
  const model=activeLca();
  const rows=[["模型",model.name],["功能单位",model.functionalUnit],["系统边界",model.boundary],["批次产量",model.batchOutput],
    ["阶段","活动","批次用量","单位","因子(kgCO₂e/单位)","分配比例(%)","参考流排放(kgCO₂e)","来源","凭证"]];
  model.stages.filter(stage=>stage.enabled).forEach(stage=>stage.lines.forEach(line=>rows.push(
    [stage.name,line.name,line.quantity,line.unit,line.factor,line.allocation,lineEmission(model,line),line.source,line.evidence])));
  downloadLcaFile(rows.map(row=>row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(",")).join("\n"),model.code+"-LCA清单.csv","text/csv");
}
function downloadLcaFile(content,name,type) {
  const link=document.createElement("a");
  link.href=URL.createObjectURL(new Blob(["\ufeff"+content],{type:type+";charset=utf-8"}));
  link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000);
}

    if(row.status==="已收集"&&!demo.approvedSuppliers[row.id])demo.approvedSuppliers[row.id]=structuredClone(row);

        {activity:8620,evidence:"GAS-JX-202607-021",status:"待审核"},

        {activity:0,evidence:"HVAC-202607-CHECK",status:"通过"},

const calculateBeforeWorkflow = demoCalculate;
demoCalculate = function (standardCode,org,period) {
  const result=calculateBeforeWorkflow(standardCode,org,period);
  result.detail=result.detail.filter(row=>row.id!==undefined && taskEntry({id:"REC-"+row.id}).status==="通过");
  if((!org||org===demoOrg)&&(!period||period===demoPeriod)) {
    Object.values(demo.approvedSuppliers).forEach(row=>result.detail.push({
      scope:"3",org:demoOrg,period:demoPeriod,category_code:row.category,
      source_name:row.supplier+" / "+row.part,activity_value:row.qty,activity_unit:row.unit,
      factor_value:row.unitCarbon/1000,gwp_value:1,emission_tco2e:row.total,evidence:row.evidence
    }));
  }
  result.detail.forEach(row=>{
    if(row.id!==undefined) {
      const entry=demo.taskEntries["REC-"+row.id];
      if(entry) {
        row.activity_value=entry.activity;
        row.evidence=entry.evidence;
        row.emission_tco2e=entry.activity*row.factor_value*row.gwp_value;
      }
    }
    row.scope="3";
  });
  if((!org||org===demoOrg)&&(!period||period===demoPeriod)) {
    workflowTasks().filter(task=>!task.locked&&!task.id.startsWith("REC-")).forEach(task=>{
      const entry=taskEntry(task);
      if(entry.status==="通过")result.detail.push({
        scope:task.scope,category_code:task.scope==="3"?task.category:"S"+task.scope,category_name:"范围"+task.scope,
        source_name:task.name,activity_value:entry.activity,activity_unit:task.unit,factor_value:task.factor,
        gwp_value:1,period:task.period,org:task.org,emission_tco2e:entry.activity*task.factor,evidence:entry.evidence
      });
    });
  }
  result.total_emission=result.detail.reduce((sum,row)=>sum+row.emission_tco2e,0);
  result.categories=[...new Set(result.detail.map(row=>row.category_code))].map(code=>{
    const entries=result.detail.filter(row=>row.category_code===code);
    const amount=entries.reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {category_code:code,category_name:code==="S1"?"范围一":code==="S2"?"范围二":categoryName(code),
      emission_tco2e:amount,share:result.total_emission?+(amount/result.total_emission*100).toFixed(2):0};
  });
  return result;
};

      ' = '+formatEmission(snapshot.total)+' tCO₂e</p><p>因子来源 · '+textHtml(snapshot.factorSource||"供应商材料清单估算")+
      '</p><p>凭证 · '+textHtml(snapshot.evidence)+'</p><p>审核 · '+snapshot.approvedBy+' · '+snapshot.approvedAt+'</p>'+
      (snapshot.attachment?'<a href="'+snapshot.attachment.data+'" download="'+textHtml(snapshot.attachment.name)+'">'+textHtml(snapshot.attachment.name)+'</a>':'')+'</section>').join(""):
      '<p>暂无批准版本。</p>'));
}

const categoryNameBeforeWorkflow=categoryName;
categoryName=function (code) {
  return code==="S1"?"范围一":code==="S2"?"范围二":categoryNameBeforeWorkflow(code);
};

function workflowIssues() {
  return workflowTasks().filter(task=>!["通过","不适用"].includes(taskEntry(task).status));
}
function setTaskApplicability() {
  if(currentRole!=="管理者")return;
  openModal('<h2>确认任务不适用</h2><label>适用性判断依据<textarea id="applicabilityReason" placeholder="填写组织边界、业务活动及判断依据"></textarea></label>'+
    '<div class="modalActions"><button class="btn primary" onclick="saveTaskApplicability()">确认并留痕</button></div>');
}
async function saveTaskApplicability() {
  if(currentRole!=="管理者")return;
  const reason=document.getElementById("applicabilityReason").value.trim();
  if(!reason){showToast("请填写不适用依据");return;}
  const task=workflowTasks().find(row=>row.id===openTaskId);
  demo.taskEntries[task.id]={...taskEntry(task),status:"不适用",reviewNote:reason};
  auditTask(task.id,"确认不适用："+reason);
  persistDemo();await loadBackendData();closeModal();render();
}
const orgCalculationBeforeWorkflow=orgCalculation;
orgCalculation=function () {
  if(state.page!=="异常数据")return orgCalculationBeforeWorkflow();
  const tasks=workflowIssues();
  return '<div class="head"><h1>待处理数据</h1></div>'+plainTaskTable(tasks,currentRole==="管理者");
};

generateScope3Report=async function () {
  const scope3=state.page==="范围三专项报告";
  const detail=backendState.calculation.detail.filter(row=>!scope3||row.scope==="3");
  const issues=workflowIssues().filter(task=>!scope3||task.scope==="3");
  const total=detail.reduce((sum,row)=>sum+row.emission_tco2e,0);
  const categories=[...new Set(detail.map(row=>row.category_code))].map(code=>{
    const emission=detail.filter(row=>row.category_code===code).reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {category_code:code,category_name:categoryName(code),emission_tco2e:emission,share:total?emission/total*100:0};
  });
  const id=Math.max(0,...demo.reports.map(row=>row.id))+1;
  demo.reports.unshift({id,standard_code:backendState.standard,org:demoOrg,period:demoPeriod,
    type:scope3?"范围三专项报告":"组织排放报告",status:issues.length?"不完整草稿":"已核对",
    total_emission:total,content_json:JSON.stringify({...backendState.calculation,detail,categories,total_emission:total,
      incompleteTasks:issues.map(task=>({id:task.id,name:task.name,status:taskEntry(task).status}))}),
    created_at:new Date().toISOString()});
  persistDemo();render();showToast(issues.length?"已生成草稿，仍有 "+issues.length+" 项待处理任务":"已生成报告快照");
};
renderStandardReport=function () {
  if(!backendState.ready)return needsBackend();
  const scope3=state.page==="范围三专项报告";
  const issues=workflowIssues().filter(task=>!scope3||task.scope==="3");
  const details=backendState.calculation.detail.filter(row=>!scope3||row.scope==="3");
  const total=details.reduce((sum,row)=>sum+row.emission_tco2e,0);
  const rows=demo.reports.filter(row=>(row.type||"范围三专项报告")===state.page);
  return '<div class="head"><h1>'+state.page+'</h1><div class="actions"><button class="btn primary" onclick="generateScope3Report()">生成'+(issues.length?"草稿":"报告")+
    '</button></div></div><div class="taskContext"><span>'+demoPeriod+'</span><span>'+formatEmission(total)+' tCO₂e</span><span>'+details.length+' 条已批准数据</span>'+
    (issues.length?'<button class="btn soft" onclick="go(\'组织碳排放\',\'核算分析\',\'异常数据\')">'+issues.length+' 项未完成</button>':'')+'</div>'+
    table("报告快照",["编号","报告类型","期间","状态","排放(tCO₂e)","生成时间","操作"],
      rows.map(row=>[row.id,row.type||"范围三专项报告",row.period,row.status||"草稿",formatEmission(row.total_emission),row.created_at,
        '<button class="btn" onclick="downloadOrgReport('+row.id+')">下载报告</button>']));
};
downloadOrgReport=function (id) {
  const report=demo.reports.find(row=>row.id===id);
  const snapshot=JSON.parse(report.content_json);
  downloadLcaFile("江南流体装备 · "+(report.type||"范围三专项报告")+"\n"+(report.status||"草稿")+"\n"+
    standardName(report.standard_code)+"\n期间 "+report.period+"\n已批准排放 "+formatEmission(report.total_emission)+" tCO₂e\n\n"+
    snapshot.detail.map(row=>"范围"+(row.scope||"3")+" · "+scenarioText(row.source_name)+"\t"+row.activity_value+" "+row.activity_unit+
      "\t"+formatEmission(row.emission_tco2e)+" tCO₂e").join("\n")+
    "\n\n待处理任务\n"+(snapshot.incompleteTasks||[]).map(task=>task.id+" "+task.name+" "+task.status).join("\n"),
    "Carbon-"+report.id+".txt","text/plain");
};

function lifecycleSankey(model) {
  const totals=lcaTotals(model);
  const total=lcaTotal(model);
  if(!total)return '<div class="emptyState">录入生命周期活动数据后生成桑基图。</div>';
  const colors=["#86bc25","#008a7a","#2c6aa0","#d59326","#8b729c"];
  const activities=model.stages.flatMap((stage,stageIndex)=>stage.enabled?stage.lines.map(line=>({
    name:line.name,value:lineEmission(model,line),stageIndex
  })):[]).sort((a,b)=>b.value-a.value);
  const hot=activities.slice(0,4);
  const remaining=activities.slice(4).reduce((sum,row)=>sum+row.value,0);
  if(remaining>0)hot.push({name:"其他活动",value:remaining,stageIndex:-1});
  const scale=230/total;
  let inOffset=0;
  let outOffset=0;
  let leftPosition=55;
  let rightPosition=55;
  const sources=totals.map((stage,index)=>{
    const width=stage.total*scale;
    const y=leftPosition+Math.max(36,width)/2;
    leftPosition+=Math.max(36,width)+8;
    const targetY=135+inOffset+width/2;
    inOffset+=width;
    return '<g class="sankeyItem" role="button" tabindex="0" aria-label="'+stage.name+
      '阶段明细" onclick="showLcaStageDetail('+index+')" onkeydown="if(event.key===\'Enter\')showLcaStageDetail('+index+')">'+
      '<path d="M 246 '+y+' C 355 '+y+' 390 '+targetY+' 488 '+targetY+
      '" fill="none" stroke="'+colors[index]+'" stroke-opacity=".48" stroke-width="'+width+'"/>'+
      '<path d="M 246 '+y+' C 355 '+y+' 390 '+targetY+' 488 '+targetY+'" fill="none" stroke="transparent" stroke-width="18"/>'+
      '<rect x="230" y="'+(y-Math.max(3,width)/2)+'" width="12" height="'+Math.max(3,width)+'" rx="2" fill="'+colors[index]+'"/>'+
      '<text x="16" y="'+(y-5)+'">'+stage.name+'</text><text class="sankeyValue" x="16" y="'+(y+15)+'">'+
      formatEmission(stage.total)+' kgCO₂e · '+(stage.total/total*100).toFixed(2)+'%</text></g>';
  }).join("");
  const targets=hot.map((activity,index)=>{
    const width=activity.value*scale;
    const y=rightPosition+Math.max(36,width)/2;
    rightPosition+=Math.max(36,width)+8;
    const startY=135+outOffset+width/2;
    outOffset+=width;
    const action=activity.stageIndex<0?"showLcaAllActivities()":"showLcaStageDetail("+activity.stageIndex+")";
    const name=activity.name.length>22?activity.name.slice(0,22)+"…":activity.name;
    return '<g class="sankeyItem" role="button" tabindex="0" aria-label="'+textHtml(activity.name)+'" onclick="'+action+
      '" onkeydown="if(event.key===\'Enter\'){'+action+'}">'+
      '<path d="M 508 '+startY+' C 650 '+startY+' 650 '+y+' 784 '+y+
      '" fill="none" stroke="'+colors[index]+'" stroke-opacity=".38" stroke-width="'+width+'"/>'+
      '<path d="M 508 '+startY+' C 650 '+startY+' 650 '+y+' 784 '+y+'" fill="none" stroke="transparent" stroke-width="18"/>'+
      '<rect x="784" y="'+(y-Math.max(3,width)/2)+'" width="12" height="'+Math.max(3,width)+'" rx="2" fill="'+colors[index]+'"/>'+
      '<text x="806" y="'+(y-5)+'">'+textHtml(name)+'</text><text class="sankeyValue" x="806" y="'+(y+15)+'">'+
      formatEmission(activity.value)+' kgCO₂e · '+(activity.value/total*100).toFixed(2)+'%</text></g>';
  }).join("");
  return '<div class="card"><h3>生命周期碳足迹流向</h3><div class="lifecycleSankey"><svg viewBox="0 0 1150 510" aria-label="生命周期碳足迹桑基图">'+
    '<text x="16" y="26" class="sankeyColumn">生命周期阶段</text><text x="440" y="26" class="sankeyColumn">产品总碳足迹</text>'+
    '<text x="806" y="26" class="sankeyColumn">活动贡献</text>'+sources+targets+
    '<rect x="488" y="135" width="20" height="230" rx="3" fill="#405124"/>'+
    '<text x="498" y="400" text-anchor="middle">'+textHtml(model.name)+'</text>'+
    '<text x="498" y="422" text-anchor="middle" class="sankeyTotal">'+formatEmission(total)+' kgCO₂e</text>'+
    '<text x="498" y="443" text-anchor="middle" class="sankeyValue">'+model.referenceFlow+' '+textHtml(model.flowUnit)+' / 参考流</text>'+
    '</svg></div></div>';
}
function showLcaAllActivities() {
  const model=activeLca();
  openModal('<h2>完整活动贡献</h2><div class="tableWrap"><table><thead><tr><th>阶段</th><th>活动</th><th>kgCO₂e / 参考流</th></tr></thead><tbody>'+
    model.stages.filter(stage=>stage.enabled).flatMap(stage=>stage.lines.map(line=>'<tr><td>'+stage.name+'</td><td>'+textHtml(line.name)+
      '</td><td>'+formatEmission(lineEmission(model,line))+'</td></tr>')).join("")+'</tbody></table></div>');
}
const productDashBeforeSankey=productDash;
productDash=function () {
  const html=productDashBeforeSankey();
  const marker='<div class="card"><div class="lcaStageHead">';
  return html.replace(marker,lifecycleSankey(activeLca())+marker);
};


async function startDemo() {
  if (false) {
    try {
      const response = await fetch("/api/demo-state");
      if (!response.ok) throw new Error("服务连接失败");
      const saved = await response.json();
      if (saved.state) {
        Object.assign(demo, saved.state);
        if (demo.supplierRows) supplyScope3Items.splice(0, supplyScope3Items.length, ...demo.supplierRows);
      }
    } catch (error) {
      console.error(error);
    }
  }
  prepareDomainData();
  prepareScenarioData();
  prepareWorkflow();
  init();
}
startDemo();
