}
function chpAnnual(name,year) {
  if(name!==CHP_COAL&&name!==CHP_ELEC)return null;
  const sums=etsSums(ets().monthly[year]);
  return name===CHP_COAL?{activity:sums.coal,emission:sums.coalEmission}:{activity:sums.elec*1000,emission:sums.elecEmission};
}

function etsTodos() {
  const list=[];
  ETS_YEARS.forEach(year=>{
    const calc=etsCalc(year),cycle=calc.cycle;

    const months=ets().monthly[year];
    months.filter(row=>row.status==="待存证").forEach(row=>list.push({year,tag:"监测",title:year+" 年 "+MONTH_NAMES[row.month-1]+"监测数据待存证",meta:"截止 "+year+"-"+String(row.month+1).padStart(2,"0")+"-10",button:"去存证",action:"openEtsMonth("+year+","+row.month+")"}));
    if(cycle.report.status==="待提交")list.push({year,tag:"报告",title:year+" 年度排放报告待提交",meta:"截止 "+(year+1)+"-03-31",button:"提交",action:"openEtsReport("+year+")",primary:true});
    if(cycle.report.status==="已提交")list.push({year,tag:"核查",title:year+" 年度排放报告核查中",meta:"提交于 "+cycle.report.submittedAt,button:"登记结论",action:"openEtsVerify("+year+")"});
    const final=cycle.alloc.final;
    if(final?.status==="待确认")list.push({year,tag:"配额",title:year+" 年度配额核定结果待确认",meta:"核定 "+fmt(final.qty,0)+" t · 确认截止 "+final.confirmBy,button:"确认",action:"go('碳履约','配额管理')",primary:true});
    if(final?.status==="异议处理中")list.push({year,tag:"配额",title:year+" 年度配额核定异议处理中",meta:"提交于 "+final.objection.at,button:"查看",action:"go('碳履约','配额管理')"});
    if(cycle.report.status==="已核查"&&final&&calc.gap<0) {
      const room=Math.max(0,Math.min(calc.cap-calc.ccer,etsCcerFree()));
      if(room>0)list.push({year,tag:"CCER",title:"可用 CCER "+fmt(room,0)+" tCO₂e 未申请抵销",meta:year+" 年度上限 "+fmt(calc.cap,0)+" · 已用 "+fmt(calc.ccer,0),button:"申请抵销",action:"openCcerApply("+year+")"});
      const buy=Math.max(0,-calc.gap-room);
      if(buy>0)list.push({year,tag:"交易",title:year+" 年度配额缺口 "+fmt(-calc.gap,0)+" t",meta:"需买入 CEA "+fmt(buy,0)+" t · 参考价 "+etsPrice().toFixed(2)+" 元/t",button:"买入",action:"openEtsOrder('买入','CEA',"+buy+")",primary:true});
    }
    if(cycle.report.status==="已核查"&&final?.status==="已确认"&&calc.gap>=0)list.push({year,tag:"清缴",title:year+" 年度配额可清缴",meta:"应清缴 "+fmt(calc.verified,0)+" t · 截止 "+cycle.deadline,button:"去清缴",action:"go('碳履约','配额清缴')",primary:true});
  });
  return list;
}

async function saveEtsMonth(year,month,attest) {
  etsYear=year;
  const row=ets().monthly[year][month-1];
  const read=id=>Number(document.getElementById(id).value);
  const values={coal:read("mCoal"),ncv:read("mNcv"),cc:read("mCc"),supply:read("mSupply"),heat:read("mHeat"),elec:read("mElec")};
  if(Object.values(values).some(value=>!(value>0))){showToast("请填写大于 0 的数值");return;}
  if(values.ncv<15||values.ncv>30){showToast("低位发热量超出合理范围（15–30 GJ/t）");return;}
  const evidence=document.getElementById("mEvidence").value.trim();
  if(attest&&!evidence){showToast("存证前请填写凭证编号");return;}
  Object.assign(row,values,{evidence});
  if(attest){row.status="已存证";row.at=todayText();}
  etsLog(year+" 年 "+MONTH_NAMES[month-1]+"监测数据"+(attest?"存证":"保存"));
  const cycle=etsCycle(year);
  if(cycle.report.status==="监测中"&&ets().monthly[year].every(item=>item.status==="已存证"))cycle.report.status="待提交";
  if(year===CURRENT_YEAR) {
    const sums=etsSums(ets().monthly[year]);
    demo.taskEntries["T-S1-04"]={...demo.taskEntries["T-S1-04"],activity:Math.round(sums.coal),evidence:"MRV-RD-"+year+String(month).padStart(2,"0")};
    demo.taskEntries["T-S2-04"]={...demo.taskEntries["T-S2-04"],activity:Math.round(sums.elec*1000),evidence:"MRV-RD-"+year+String(month).padStart(2,"0")};
    persistDemo();
    await loadBackendData();
  }
  persistDemo();closeModal();render();showToast(attest?"已存证，组织盘查热电数据已同步":"已保存");
}

function saveEtsOrder(side,product) {
  const qty=Number(document.getElementById("oQty").value),price=Number(document.getElementById("oPrice").value);
  if(!(qty>=100)||qty%100){showToast("数量需为 100 的整数倍");return;}
  if(!(price>0)){showToast("请填写委托价");return;}
  const data=ets();
  const vintage=product==="CEA"?Number(document.getElementById("oVintage").value):2024;
  const project=product==="CCER"?document.getElementById("oProject").value:"";
  const market=product==="CEA"?etsPrice():CCER_LISTINGS.find(row=>row.project===project).price;
  if(side==="卖出"&&(etsHoldings()[vintage]||0)<qty){showToast(vintage+" 年度配额余额不足");return;}
  if(price>market*1.1||price<market*0.9){showToast("委托价超出 ±10% 涨跌幅限制（"+(market*0.9).toFixed(2)+"–"+(market*1.1).toFixed(2)+"）");return;}
  const fill=side==="买入"?price>=market:price<=market;
  const at=nowText();
  const id="WT"+todayText().replace(/-/g,"")+String(data.orders.length+31).padStart(4,"0");
  const order={id,at:at.slice(0,16),side,product,vintage,qty,price,filledPrice:fill?+market.toFixed(2):null,status:fill?"已成交":"已报",filledAt:fill?todayText():"",channel:document.getElementById("oChannel").value,year:etsFocusYear(),project};
  data.orders.unshift(order);
  if(fill)etsSettleOrder(order);
  etsLog((fill?"成交 ":"委托 ")+side+" "+product+" "+fmt(qty,0)+" t @ "+price.toFixed(2)+(project?" · "+project:""));
  persistDemo();closeModal();render();
  showToast(fill?side+"成交 "+fmt(qty,0)+" t，成交价 "+market.toFixed(2)+" 元":"委托已报，等待成交");
}
function etsSettleOrder(order) {
  const data=ets();
  if(order.product==="CEA")data.ledger.push({id:"LG"+String(++data.seq).padStart(5,"0"),date:todayText(),type:order.side,vintage:order.vintage,qty:order.side==="买入"?order.qty:-order.qty,ref:order.id,year:order.year});
  else data.ccer.push({id:"CCER-"+CURRENT_YEAR+"-"+String(1200+data.ccer.length*37).padStart(4,"0"),project:order.project,type:CCER_LISTINGS.find(row=>row.project===order.project).type,vintage:2024,qty:order.qty,acquiredAt:todayText(),price:order.filledPrice,status:"可用",ref:order.id});
}
function cancelEtsOrder(id) {
  const order=ets().orders.find(row=>row.id===id);
  if(!order||order.status!=="已报")return;
  order.status="已撤单";
  etsLog("撤单 "+id);
  persistDemo();render();showToast("已撤单");
}

// 配额清缴
function etsSurrenderPlan(year) {
  const calc=etsCalc(year),holdings=etsHoldings();
  let left=calc.need;const plan=[];
  Object.keys(holdings).map(Number).sort().forEach(vintage=>{
    if(vintage>year||left<=0||holdings[vintage]<=0)return;
    const take=Math.min(holdings[vintage],left);plan.push({vintage,take});left-=take;
  });
  return {plan,short:left};
}
function etsSurrenderPage() {
  const year=etsSel(),calc=etsCalc(year),cycle=calc.cycle;
  if(calc.settled) {
    return etsHead("配额清缴",'<button class="btn" onclick="showEtsCert('+year+')">清缴凭证</button>')+
      '<div class="statRow">'+statTile("核查排放",fmt(calc.verified,0),"tCO₂")+statTile("清缴 CEA",fmt(cycle.surrender.cea,0),"t")+statTile("CCER 抵销",fmt(cycle.surrender.ccer,0),"tCO₂e")+
        statTile("清缴日期",cycle.surrender.at,cycle.surrender.cert)+'</div>'+etsSurrenderLedger(year);
  }
  const {plan,short}=etsSurrenderPlan(year);
  const checks=[
    ["排放报告核查完成",calc.verifiedDone,calc.verifiedDone?cycle.report.verifyNo:"未核查"],
    ["配额核定结果已确认",cycle.alloc.final?.status==="已确认",cycle.alloc.final?cycle.alloc.final.status:"未下发"],
    ["CEA 余额满足清缴",short<=0,short>0?"缺 "+fmt(short,0)+" t":"满足"],
    ["CCER 抵销不超过 5%",calc.ccer<=calc.cap,fmt(calc.ccer,0)+" / "+fmt(calc.cap,0)]
  ];
  const ready=checks.every(item=>item[1]);

const VENDOR = "vendor/";
const EV_UNITS = {
  "kWh":["kWh",1],"千瓦时":["kWh",1],"度":["kWh",1],"MWh":["kWh",1000],"万kWh":["kWh",10000],"万千瓦时":["kWh",10000],
  "Nm³":["Nm³",1],"Nm3":["Nm³",1],"m³":["Nm³",1],"m3":["Nm³",1],"立方米":["Nm³",1],"万m³":["Nm³",10000],"万立方米":["Nm³",10000],
  "t":["kg",1000],"吨":["kg",1000],"kg":["kg",1],"千克":["kg",1],"公斤":["kg",1],
  "L":["L",1],"升":["L",1],"GJ":["GJ",1],"吉焦":["GJ",1],"t·km":["t·km",1],"吨公里":["t·km",1],"tkm":["t·km",1],"人·km":["人·km",1],"元":["元",1],"万元":["元",10000]
};
function unitBase(unit){return EV_UNITS[String(unit||"").trim()]||null;}
function convertUnit(value,from,to) {
  if(from===to)return value;
  const a=unitBase(from),b=unitBase(to);
  if(!a||!b||a[0]!==b[0])return null;
  return value*a[1]/b[1];
}
function loadScriptOnce(src) {
  window.__loadedScripts ||= {};
  if(window.__loadedScripts[src])return window.__loadedScripts[src];
  window.__loadedScripts[src]=new Promise((resolve,reject)=>{
    const node=document.createElement("script");
    node.src=src;node.onload=resolve;node.onerror=()=>{delete window.__loadedScripts[src];reject(new Error("加载失败："+src));};
    document.head.appendChild(node);
  });
  return window.__loadedScripts[src];
}
async function sha256Hex(buffer) {
  try {
    const digest=await crypto.subtle.digest("SHA-256",buffer);
    return [...new Uint8Array(digest)].map(byte=>byte.toString(16).padStart(2,"0")).join("");
  } catch {
    let hash=2166136261;const bytes=new Uint8Array(buffer);
    for(let i=0;i<bytes.length;i++){hash^=bytes[i];hash=Math.imul(hash,16777619);}
    return (hash>>>0).toString(16).padStart(8,"0")+bytes.length.toString(16);
  }
}
function fileSizeText(bytes){return bytes>1048576?(bytes/1048576).toFixed(1)+" MB":Math.max(1,Math.round(bytes/1024))+" KB";}

// 文件内容存在浏览器 IndexedDB，元数据随业务数据保存
function evDb() {
  if(window.__evDb)return window.__evDb;
  window.__evDb=new Promise((resolve,reject)=>{
    const request=indexedDB.open("carbon-evidence",1);
    request.onupgradeneeded=()=>request.result.createObjectStore("files");
    request.onsuccess=()=>resolve(request.result);
    request.onerror=()=>reject(request.error);
  });
  return window.__evDb;
}
async function evPutFile(id,file) {
  const db=await evDb();
  return new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});
}
async function evGetFile(id) {
  const db=await evDb();
  return new Promise((resolve,reject)=>{const request=db.transaction("files").objectStore("files").get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});
}

let ocrWorkerPromise=null;
async function ocrWorker(progress) {
  await loadScriptOnce(VENDOR+"tess/tesseract.min.js");
  window.__ocrProgress=progress;
  ocrWorkerPromise ||= Tesseract.createWorker("chi_sim+eng",1,{workerPath:VENDOR+"tess/worker.min.js",corePath:VENDOR+"tess/",langPath:VENDOR+"lang/",gzip:true,
    logger:message=>window.__ocrProgress?.(message)}).then(async worker=>{await worker.setParameters({tessedit_pageseg_mode:"6",preserve_interword_spaces:"1"});return worker;});
  return ocrWorkerPromise;
}
async function ocrImage(source,progress) {
  const worker=await ocrWorker(progress);
  const result=await worker.recognize(source);
  return {text:result.data.text,confidence:result.data.confidence/100,engine:"OCR"};
}
async function pdfText(buffer,progress) {
  await loadScriptOnce(VENDOR+"pdf.min.js");
  pdfjsLib.GlobalWorkerOptions.workerSrc=VENDOR+"pdf.worker.min.js";
  const pdf=await pdfjsLib.getDocument({data:buffer}).promise;
  let text="";
  for(let page=1;page<=Math.min(pdf.numPages,5);page++) {
    const content=await (await pdf.getPage(page)).getTextContent();
    let lastY=null;
    content.items.forEach(item=>{const y=Math.round(item.transform[5]);text+=(lastY!==null&&Math.abs(y-lastY)>3?"\n":"")+item.str;lastY=y;});
    text+="\n";
  }
  if(text.replace(/\s/g,"").length>=20)return {text,confidence:0.99,engine:"PDF 文本层"};
  progress?.({status:"扫描件，转 OCR",progress:0});
  const page=await pdf.getPage(1);
  const viewport=page.getViewport({scale:2});
  const canvas=document.createElement("canvas");canvas.width=viewport.width;canvas.height=viewport.height;
  await page.render({canvasContext:canvas.getContext("2d"),viewport}).promise;
  return ocrImage(canvas,progress);
}
async function extractFileText(file,progress) {
  const name=file.name.toLowerCase();
  if(file.type.startsWith("image/"))return ocrImage(file,progress);
  if(file.type==="application/pdf"||name.endsWith(".pdf"))return pdfText(await file.arrayBuffer(),progress);
  if(/\.(csv|txt|tsv)$/.test(name))return {text:await file.text(),confidence:1,engine:"文本"};
  return {text:"",confidence:0,engine:"不支持"};
}
const QTY_KEYS = ["本期电量","结算电量","下网电量","用电量","电量","用气量","气量","加油量","充注量","入厂煤量","入炉煤量","煤量","用汽热量","热量","货物周转量","周转量","通勤里程","入库量","供货量","数量","用量","重量"];
function cleanOcr(text) {
  return String(text).replace(/[：]/g,":").replace(/，/g,",").replace(/[ \t]+/g," ")
    .replace(/(\d)\s+(?=[\d,.]*\d)/g,(m,d)=>d).replace(/N\s*m\s*[3³]/g,"Nm³").replace(/m\s*[3³]/g,"m³").replace(/k\s*W\s*h/gi,"kWh").replace(/M\s*W\s*h/g,"MWh");

function parseEvidenceText(raw) {

  const issuerLine=lines.find(line=>/(公司|中心|部|集团)/.test(line)&&line.length<=40);
  if(issuerLine)take("issuer",issuerLine.replace(/(电费|燃气|蒸汽)?(结算单|对账单|汇总表|明细|声明|记录).*$/,"").trim(),0.8);
  const type=DOC_TYPES.map(row=>row.type).concat(["产品碳足迹声明","入厂煤计量与化验单","增值税专用发票","运输周转量汇总表"]).find(name=>text.includes(name));
  if(type)take("type",type,0.95);
  const labeled=(labels,pattern)=>{for(const label of labels){const m=text.match(new RegExp(label+"\\s*[:]?\\s*"+pattern));if(m)return m;}return null;};
  let m=labeled(["户号","用户编号","客户编号","账户","合同号"],"([A-Z0-9][A-Z0-9 \\-]{4,24})");if(m)take("account",m[1].trim(),0.95);
  m=labeled(["户名","用户名称","客户名称","购买方名称","采购方","客户"],"([\\u4e00-\\u9fa5（）()A-Za-z]{4,40})");if(m)take("holder",m[1].trim(),0.9);
  m=labeled(["产品名称","产品","物料"],"([\\u4e00-\\u9fa5A-Za-z0-9 \\-]{2,30})");if(m)take("product",m[1].trim(),0.85);
  m=text.match(/(\d{4})\s*[年\-\/.]\s*(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})?\s*日?\s*(至|到|-|—|~|～)\s*(\d{4})\s*[年\-\/.]\s*(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})?/);
  if(m)take("period",m[1]+"-"+m[2].padStart(2,"0")+(m[3]?"-"+m[3].padStart(2,"0"):"")+" 至 "+m[5]+"-"+m[6].padStart(2,"0")+(m[7]?"-"+m[7].padStart(2,"0"):""),0.95);
  else if((m=text.match(/(\d{4})\s*年\s*(\d{1,2})\s*月/)))take("period",m[1]+"-"+m[2].padStart(2,"0"),0.8);
  m=labeled(["单据编号","结算单号","发票号码","编号","凭证号","No\\.?"],"([A-Z0-9][A-Z0-9\\-]{5,30})");if(m)take("docNo",m[1],0.95);
  const unitPattern="(万kWh|万千瓦时|MWh|kWh|千瓦时|万m³|万立方米|Nm³|m³|立方米|t·km|吨公里|tkm|人·km|kg|千克|公斤|GJ|吉焦|吨|t|升|L)";
  const numberPattern="([\\d,]+(?:\\.\\d+)?)";
  let qty=null;
  for(const key of QTY_KEYS) {

    if(hit){qty={value:Number(hit[1].replace(/,/g,"")),unit:hit[2],label:key,c:0.95};break;}

  m=text.match(/([\d.]+)\s*kg\s*CO\s*[2₂]\s*e?\s*\/\s*(kg|t|件|台|t·km)/i);if(m)take("carbon",Number(m[1]),0.9),take("carbonUnit","kgCO₂e/"+m[2],0.9);

}
function suggestTaskFor(fields) {
  const tasks=workflowTasks().filter(task=>!task.locked&&(currentRole!=="填报人"||task.owner===fillerIdentity));
  const typeDoc=DOC_TYPES.find(row=>row.type===fields.type);
  return tasks.map(task=>{
    let score=0;
    const doc=docTypeFor(task.name);
    if(typeDoc&&doc&&doc.type===typeDoc.type)score+=0.45;
    if(fields.issuer&&doc&&doc.issuer.slice(0,4)===fields.issuer.slice(0,4))score+=0.2;
    if(fields.unit&&convertUnit(1,fields.unit,task.unit)!==null)score+=0.2;
    const shortOrg=String(task.org||"").replace(/江南流体装备集团?/,"");
    if(fields.holder&&shortOrg&&fields.holder.includes(shortOrg))score+=0.15;
    return {task,score};
  }).filter(row=>row.score>=0.35).sort((a,b)=>b.score-a.score);
}

async function ingestEvidence(file,{taskId,source,org,onProgress}={}) {

  const buffer=await file.arrayBuffer();

    period:parsed.fields.period||"",uploader:currentPerson(),uploadedAt:new Date().toLocaleString("zh-CN",{hour12:false}),size:file.size,sha256,
    fields:parsed.fields,confidence:parsed.conf,engine:extracted.engine,ocrConfidence:extracted.confidence,rawText:extracted.text.slice(0,4000),
    verified:false,status:taskId?"已关联":"未关联",origin:"upload",duplicateOf:duplicate?.id||""};

function bigrams(text) {
  const clean=String(text).toLowerCase().replace(/[\s·（）()\/\-，,]/g,"");
  const set=new Set();
  for(let i=0;i<clean.length-1;i++)set.add(clean.slice(i,i+2));
  if(clean.length===1)set.add(clean);
  return set;
}
function dice(a,b) {
  const x=bigrams(a),y=bigrams(b);
  if(!x.size||!y.size)return 0;
  let hit=0;x.forEach(item=>{if(y.has(item))hit++;});
  return 2*hit/(x.size+y.size);
}
function matchFactors(task,limit=5) {
  const query=task.name+" "+(task.factorLabel||"")+" "+(task.scope==="3"?categoryName(task.category):"");
  const region=/嘉兴|湖州|杭州|浙江/.test(task.org||"")?"浙江":"";
  return FACTOR_DB.map(row=>{
    const nameSim=Math.max(dice(task.name,row.name),dice(query,row.name+" "+row.keys));
    const keyHit=row.keys.split(" ").some(key=>key.length>1&&query.includes(key))?1:0;
    const text=Math.min(1,nameSim*0.6+keyHit*0.55);
    const converted=convertUnit(1,task.unit,row.unit);
    const unitScore=row.unit===task.unit?1:converted!==null?0.85:0;
    const scopeScore=row.scope===task.scope?1:0.3;
    const regionScore=row.region===region?1:row.region==="华东"&&region?0.85:row.region==="全国"?0.7:0.5;
    const recency=Math.max(0,1-(CURRENT_YEAR-row.year)/12);
    const score=unitScore?text*0.55+unitScore*0.2+scopeScore*0.1+regionScore*0.07+recency*0.08:text*0.3;
    const value=converted!==null?row.value*converted:null;
    const reasons=[];
    if(keyHit||nameSim>0.3)reasons.push("名称语义匹配");
    if(unitScore===1)reasons.push("单位一致");else if(unitScore)reasons.push(row.unit+" → "+task.unit+" 自动换算");else reasons.push("单位不可换算");
    if(row.region!=="全国")reasons.push("区域 "+row.region);
    reasons.push(row.year+" 年");
    return {row,score,value,reasons};

function sourceKey(row){return scenarioText(row.source_name)+"|"+row.scope;}
function narrativeData() {
  const now=approvedDetail();
  const prev=typeof detailForYear==="function"?detailForYear(CURRENT_YEAR-1):[];
  const sum=rows=>rows.reduce((total,row)=>total+row.emission_tco2e,0);
  const byScope=rows=>{const out={"1":0,"2":0,"3":0};rows.forEach(row=>out[String(row.scope)]+=row.emission_tco2e);return out;};
  const prevMap={};prev.forEach(row=>{prevMap[sourceKey(row)]=row;});
  const drivers=now.map(row=>{const old=prevMap[sourceKey(row)];if(!old)return null;
    const activityEffect=(row.activity_value-old.activity_value)*old.factor_value;
    const factorEffect=row.activity_value*(row.factor_value-old.factor_value);
    return {row,old,delta:row.emission_tco2e-old.emission_tco2e,activityEffect,factorEffect};}).filter(Boolean);
  const comparable=drivers.map(item=>item.row);
  return {now,prev,total:sum(now),scopes:byScope(now),prevScopes:byScope(prev.filter(row=>drivers.some(item=>sourceKey(item.old)===sourceKey(row)))),
    drivers:drivers.sort((a,b)=>Math.abs(b.delta)-Math.abs(a.delta)),comparableNow:sum(comparable),comparablePrev:sum(drivers.map(item=>item.old)),
    issues:workflowIssues()};
}

  ]});

const demoCalculateBeforeFallback = demoCalculate;
demoCalculate = function (standardCode,org,period) {
  const result=demoCalculateBeforeFallback(standardCode,org,period);
  if((!org||org===demoOrg)&&(!period||period===demoPeriod)) {
    procurementLines().filter(line=>line.tier>1).forEach(line=>result.detail.push({
      scope:"3",org:demoOrg,period:demoPeriod,category_code:line.category,source_name:line.supplier+" / "+line.item,
      activity_value:line.tier===2?line.qty:line.spend,activity_unit:line.tier===2?line.unit:"万元",
      factor_value:line.tier===2?line.emission/line.qty:line.factorRef.value,gwp_value:1,emission_tco2e:line.emission,
      evidence:"ERP-PO-"+line.id,quality:QUALITY[line.tier],fallback:true
    }));
  }
  result.detail.forEach(row=>{
    if(row.quality)return;
    if(String(row.scope)==="3"&&String(row.source_name).includes(" / "))row.quality=QUALITY[1];
    else row.quality=SOURCE_QUALITY[scenarioText(row.source_name)]||"一级 · 实测/票据";
  });
  result.total_emission=result.detail.reduce((sum,row)=>sum+row.emission_tco2e,0);
  result.categories=[...new Set(result.detail.map(row=>row.category_code))].map(code=>{
    const amount=result.detail.filter(row=>row.category_code===code).reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {category_code:code,category_name:code==="S1"?"范围一":code==="S2"?"范围二":categoryName(code),emission_tco2e:amount,share:result.total_emission?+(amount/result.total_emission*100).toFixed(2):0};
  });
  return result;
};

function deptOf(code){return Object.keys(S3_DEPTS).find(name=>S3_DEPTS[name].codes.includes(code))||"财务与战略部";}
function unitOfRow(row,target) {
  if(target&&target.scope==="3")return deptOf(row.category_code);
  if(String(row.scope)==="3")return "杭州总部";
  const name=orgUnitName(row.org);
  return UNIT_ALIAS[name]||name;
}
function allocUnits(target){return target.scope==="3"?Object.keys(S3_DEPTS):ORG_UNITS.map(item=>item.unit);}
function unitOwner(target,unit){return target.scope==="3"?S3_DEPTS[unit].owner:(ORG_UNITS.find(item=>item.unit===unit)||{}).owner||"—";}
function inTarget(target,row){const scope=String(row.scope);return target.scope==="12"?scope!=="3":target.scope==="3"?scope==="3":true;}
function unitValue(target,unit,year) {
  const value=detailForYear(year).filter(row=>inTarget(target,row)&&unitOfRow(row,target)===unit).reduce((sum,row)=>sum+row.emission_tco2e,0);
  return target.type==="intensity"?value/(YEAR_REVENUE[year]*(target.scope==="3"?1:UNIT_REVENUE_SHARE[unit]||1)):value;
}
function unitBaseEmission(target,unit){return detailForYear(targets().baseYear).filter(row=>inTarget(target,row)&&unitOfRow(row,target)===unit).reduce((sum,row)=>sum+row.emission_tco2e,0);}
function unitPendingTasks(target,unit) {
  return workflowTasks().filter(task=>{
    if(target.scope==="12"&&task.scope==="3")return false;
    if(target.scope==="3"&&task.scope!=="3")return false;
    const owner=task.scope==="3"?(target.scope==="3"?deptOf(task.category||((task.id.match(/C\d\d/)||[])[0])||"C01"):"杭州总部"):(UNIT_ALIAS[task.org]||task.org);
    return owner===unit&&!["通过","不适用"].includes(taskEntry(task).status);
  });
}

      "TG-02":{method:"custom",units:{"产品研发中心":26,"采购中心":24,"物流部":30,"行政人事部":15,"财务与战略部":10},issued:"2026-01-15",version:1}
    };

}
targetPath = function (target,year) {
  const base=targetBase(target);
  return base*(1-pathCut(target,year,target.reduction)/100);
};
function pathCut(target,year,reduction) {
  const baseYear=targets().baseYear,end=target.targetYear;
  const interim=target.interim&&target.interim.year>baseYear&&target.interim.year<end?target.interim:null;
  const scale=reduction/target.reduction;
  const points=[[baseYear,0],...(interim?[[interim.year,interim.reduction*scale]]:[]),[end,reduction]];
  if(year<=baseYear)return 0;
  if(year>=end)return reduction;
  for(let i=1;i<points.length;i++)if(year<=points[i][0]){
    const [x0,y0]=points[i-1],[x1,y1]=points[i];
    return y0+(y1-y0)*(year-x0)/(x1-x0);
  }
  return reduction;
}
function allocOf(target) {
  const config=targetsV2();
  config.alloc[target.id]||={method:"equal",units:{},issued:"",version:0};
  const alloc=config.alloc[target.id];
  const units=allocUnits(target);
  const bases=units.map(unit=>unitValue(target,unit,config.baseYear));
  const emissions=units.map(unit=>unitBaseEmission(target,unit));
  const total=emissions.reduce((a,b)=>a+b,0)||1;
  const shares=emissions.map(value=>value/total);
  let cuts;
  if(alloc.method==="equal")cuts=units.map(()=>target.reduction);
  else if(alloc.method==="weighted") {
    const denom=shares.reduce((sum,share)=>sum+share*Math.sqrt(share),0)||1;
    cuts=shares.map(share=>Math.min(95,target.reduction*Math.sqrt(share)/denom));
  } else cuts=units.map(unit=>Number(alloc.units[unit]??target.reduction));
  const rows=units.map((unit,index)=>({unit,owner:unitOwner(target,unit),base:bases[index],share:shares[index],cut:cuts[index]}));
  const weighted=rows.reduce((sum,row)=>sum+row.share*row.cut,0);
  return {alloc,rows,weighted,covered:weighted>=target.reduction-0.05};
}
function unitStatus(target,row,year=CURRENT_YEAR) {
  const actual=unitValue(target,row.unit,year);
  const path=row.base*(1-pathCut(target,year,row.cut)/100);
  const pending=year===CURRENT_YEAR?unitPendingTasks(target,row.unit).length:0;
  return {actual,path,pending,ahead:actual<=path,reduced:row.base?(1-actual/row.base)*100:0};
}

function setAllocMethod(method) {
  const target=targetsV2().items.find(item=>item.id===allocTargetId);
  const plan=allocOf(target);
  if(method==="custom")plan.rows.forEach(row=>plan.alloc.units[row.unit]=+row.cut.toFixed(1));
  plan.alloc.method=method;persistDemo();render();
}
function readCutInputs(plan) {
  document.querySelectorAll(".cutInput").forEach(input=>{plan.alloc.units[input.dataset.unit]=Number(input.value)||0;});
}
function previewAlloc() {
  const target=targetsV2().items.find(item=>item.id===allocTargetId);
  const shares=allocOf(target).rows.map(row=>row.share);
  let weighted=0;document.querySelectorAll(".cutInput").forEach((input,index)=>weighted+=(Number(input.value)||0)*shares[index]);
  const cell=document.getElementById("allocWeighted");if(cell){cell.textContent="−"+weighted.toFixed(1)+"%";cell.className=weighted>=target.reduction-0.05?"okText":"badText";}
}
function saveAlloc(issue) {
  const target=targetsV2().items.find(item=>item.id===allocTargetId);
  let plan=allocOf(target);
  if(plan.alloc.method==="custom"){readCutInputs(plan);plan=allocOf(target);}
  if(issue&&!plan.covered){showToast("分解加权降幅 "+plan.weighted.toFixed(1)+"% 低于集团目标 "+target.reduction+"%，请调整后下发");return;}
  if(issue) {
    const now=new Date().toLocaleString("zh-CN",{hour12:false});
    plan.alloc.log||=[];
    if(!plan.alloc.log.length&&plan.alloc.issued)plan.alloc.log.push({version:plan.alloc.version,at:plan.alloc.issued,method:plan.alloc.method,weighted:plan.weighted,by:MANAGER_NAME});
    plan.alloc.version=(plan.alloc.version||0)+1;plan.alloc.issued=now.slice(0,10).replace(/\//g,"-");
    plan.alloc.log.push({version:plan.alloc.version,at:now,method:plan.alloc.method,weighted:plan.weighted,by:MANAGER_NAME});
  }
  persistDemo();render();showToast(issue?"已下发至 "+plan.rows.length+" 个"+(target.scope==="3"?"责任部门":"下属单位"):"已保存");
}

const LINE_DQ = {"企业实测":{p:1,u:0.05},"供应商声明":{p:2,u:0.1},"行业平均":{p:3,u:0.2},"情景估算":{p:3,u:0.3}};
function lineQuality(line) {
  const src=String(line.source||"");
  const kind=/供应商/.test(src)?"供应商声明":line.quality==="情景估算"||/情景|方案/.test(src)?"情景估算":/电表|记录|计量|领料|试验/.test(src)?"企业实测":"行业平均";
  const ti=Number(line.year)>=2025?1:Number(line.year)>=2022?2:3;
  const ge=/华东|浙江|中国/.test(String(line.region||"")+src)?(/华东|浙江/.test(src)?1:2):3;
  const te=kind==="企业实测"||kind==="供应商声明"?1:2;
  const p=LINE_DQ[kind].p;
  return {kind,ti,ge,te,p,dqr:(ti+ge+te+p)/4,u:LINE_DQ[kind].u};
}
function dqrLabel(value){return value<=1.6?"优秀":value<=2?"很好":value<=3?"良好":"一般";}

}

function privateFactorList() {

  const yr=CURRENT_YEAR,prev=yr-1,months=(ets().monthly[yr]||[]).filter(row=>row.status==="已存证");
  const coalEf=row=>+(row.ncv*row.cc*0.98*44/12).toFixed(4);
  const prevRows=ets().monthly[prev]||[];
  const wavg=rows=>{const c=rows.reduce((s,r)=>s+r.coal,0);return c?+(rows.reduce((s,r)=>s+coalEf(r)*r.coal,0)/c).toFixed(4):0;};
  list.push({id:id(),cat:"固定燃烧",name:"入炉烟煤（"+prev+" 年加权实测）",value:wavg(prevRows),unit:"tCO₂/t",site:"嘉兴热电分公司",basis:"GB/T 213 逐月检测 · 核查报告 "+(ets().cycles[prev]?.report?.verifyNo||""),valid:prev+" 年度",status:"已核查"});
  months.slice().reverse().forEach(row=>list.push({id:id(),cat:"固定燃烧",name:"入炉烟煤（"+yr+" 年 "+row.month+" 月实测）",value:coalEf(row),unit:"tCO₂/t",site:"嘉兴热电分公司",
    basis:"低位发热量 "+row.ncv+" GJ/t × 单位热值含碳量 "+row.cc+" tC/GJ × 氧化率 0.98 · "+row.evidence,valid:yr+"-"+String(row.month).padStart(2,"0"),status:"已存证"}));

const ETS_DEADLINE = {2019:"2021-12-31",2020:"2021-12-31",2021:"2023-12-31",2022:"2023-12-31"};
function unitShare(unit,year,month,kind) {
  const base=kind==="heat"?0.41:0.545;
  const s1=base+0.025*Math.sin(month*0.9+year*0.7)+(kind==="heat"?0.01*Math.cos(month):0);
  return unit==="1"?s1:1-s1;
}
function scaleMonths(months,year,unit) {
  return months.map(row=>{const s=unitShare(unit,year,row.month,"power"),h=unitShare(unit,year,row.month,"heat");
    const c=s*0.6+h*0.4;
    return {...row,coal:Math.round(row.coal*c),supply:Math.round(row.supply*s),heat:Math.round(row.heat*h),elec:+(row.elec*s).toFixed(1)};});
}

const CRC_TABLE = (()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;table[n]=c>>>0;}return table;})();
function crc32(bytes){let c=0xFFFFFFFF;for(let i=0;i<bytes.length;i++)c=CRC_TABLE[(c^bytes[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipFiles(files) {
  const enc=new TextEncoder();
  const parts=[],central=[];let offset=0;
  const u16=v=>[v&255,(v>>8)&255],u32=v=>[v&255,(v>>8)&255,(v>>16)&255,(v>>>24)&255];
  const now=new Date(),dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()>>1),dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  files.forEach(file=>{
    const name=enc.encode(file.name),data=typeof file.data==="string"?enc.encode(file.data):file.data,crc=crc32(data);
    const header=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(dosTime),...u16(dosDate),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0)]);
    parts.push(header,name,data);
    central.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(dosTime),...u16(dosDate),...u32(crc),...u32(data.length),...u32(data.length),...u16(name.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset)]),name);
    offset+=header.length+name.length+data.length;
  });
  const size=central.reduce((sum,part)=>sum+part.length,0);
  const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(size),...u32(offset),0,0]);
  return new Blob([...parts,...central,end],{type:"application/zip"});
}
function saveBlob(blob,name){const link=document.createElement("a");link.href=URL.createObjectURL(blob);link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),2000);}
const xmlEsc=text=>String(text??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");
function cellText(node){return (node.innerText??node.textContent??"").replace(/\s*\n\s*/g," ").trim();}
function numericValue(text) {
  const clean=String(text).replace(/,/g,"").trim();
  return /^[+\-−]?\d+(\.\d+)?$/.test(clean)?Number(clean.replace("−","-")):null;
}
function safeName(text){return String(text).replace(/[\\/:*?"<>|]/g,"_").slice(0,80);}

    {name:"xl/styles.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="3"><font><sz val="10"/><name val="Microsoft YaHei"/></font><font><b/><sz val="10"/><name val="Microsoft YaHei"/></font><font><b/><sz val="13"/><color rgb="FF26890D"/><name val="Microsoft YaHei"/></font></fonts>'+

// ---------- 报告结构提取 ----------
function reportStructure(doc) {
  const out={title:cellText(doc.querySelector(".rptCover h1")||{textContent:""}).replace(/(草稿|已核对|未核查|已核查)$/,"").trim(),
    titleLines:[...((doc.querySelector(".rptCover h1")||{}).childNodes||[])].filter(n=>n.nodeType===3).map(n=>n.textContent.trim()).filter(Boolean),
    tag:cellText(doc.querySelector(".rptTag")||{textContent:""}),meta:[...doc.querySelectorAll(".rptMeta>div")].map(div=>[cellText(div.querySelector("span")),cellText(div).replace(cellText(div.querySelector("span")),"").trim()]),sections:[]};
  doc.querySelectorAll(".rptSec").forEach(sec=>{
    const blocks=[];
    const walk=node=>{
      [...node.children].forEach(el=>{
        const tag=el.tagName.toLowerCase();
        if(tag==="h2")return;
        if(tag==="h3"||tag==="h4")blocks.push({type:"h3",text:cellText(el)});
        else if(tag==="p")blocks.push({type:"p",text:cellText(el)});
        else if(tag==="ul"||tag==="ol")el.querySelectorAll("li").forEach(li=>blocks.push({type:"li",text:cellText(li)}));
        else if(tag==="table")blocks.push({type:"table",rows:tableRows(el)});
        else if(el.classList.contains("rptKpis"))blocks.push({type:"table",rows:[["指标","数值","单位"],...[...el.children].map(div=>[cellText(div.querySelector("span")),cellText(div.querySelector("b")),cellText(div.querySelector("small"))])]});
        else if(el.classList.contains("sig"))blocks.push({type:"p",text:[...el.children].map(cellText).join("    ")});
        else if(tag==="svg"||el.classList.contains("rptLegend"))return;
        else walk(el);
      });
    };
    walk(sec);
    out.sections.push({title:cellText(sec.querySelector("h2")).replace(/^(\d+)/,"$1 "),blocks});
  });
  return out;
}

    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="120"/><w:pBdr><w:bottom w:val="single" w:sz="12" w:space="4" w:color="86BC25"/></w:pBdr><w:outlineLvl w:val="0"/></w:pPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="200" w:after="80"/><w:outlineLvl w:val="1"/></w:pPr></w:style></w:styles>';
  const blob=zipFiles([
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>'},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/></Relationships>'},
    {name:"word/_rels/document.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'},
    {name:"docProps/core.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:title>'+xmlEsc(structure.title)+'</dc:title><dc:creator>江南流体装备集团</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">'+new Date().toISOString().slice(0,19)+'Z</dcterms:created></cp:coreProperties>'},
    {name:"word/document.xml",data:documentXml},
    {name:"word/styles.xml",data:styles}
  ]);
  return new Blob([blob],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

// ---------- 报告导出 ----------
function reportElement(){return document.querySelector("#content .rptDoc");}
function reportFileName() {
  const s=reportStructure(reportElement());
  return safeName((s.titleLines.join(" ")||s.title||"报告")+"-"+new Date().toISOString().slice(0,10));
}
function csvText(rows){return "﻿"+rows.map(row=>row.map(value=>{const text=String(value??"");return /[",\n]/.test(text)?'"'+text.replace(/"/g,'""')+'"':text;}).join(",")).join("\r\n");}
async function exportReport(format) {
  closeExportMenus();
  const doc=reportElement();
  if(!doc){showToast("当前页面没有报告");return;}
  const s=reportStructure(doc),name=reportFileName();
  if(format==="docx"){saveBlob(docxBlob(s),name+".docx");showToast("已导出 Word");return;}
  if(format==="xlsx") {
    const sheets=[{name:"封面",rows:[[s.titleLines.join(" ")||s.title],[],["项目","内容"],...s.meta],titles:[0],headers:[2]}];
    s.sections.forEach(sec=>{
      const rows=[[sec.title]],headers=[],titles=[0];
      sec.blocks.forEach(block=>{
        if(block.type==="table"){rows.push([]);headers.push(rows.length);rows.push(...block.rows);}
        else if(block.type==="h3"){rows.push([]);titles.push(rows.length);rows.push([block.text]);}
        else rows.push([block.text]);
      });
      sheets.push({name:sec.title,rows,headers,titles});
    });
    saveBlob(xlsxBlob(sheets),name+".xlsx");showToast("已导出 Excel");return;
  }
  if(format==="csv") {
    const rows=[[s.titleLines.join(" ")||s.title],...s.meta,[]];
    s.sections.forEach(sec=>{rows.push([sec.title]);sec.blocks.forEach(block=>{if(block.type==="table")rows.push(...block.rows);else rows.push([block.text]);});rows.push([]);});
    saveBlob(new Blob([csvText(rows)],{type:"text/csv;charset=utf-8"}),name+".csv");showToast("已导出 CSV");return;
  }
  if(format==="pdf")return exportPdf(doc,name);
}
async function exportPdf(doc,name) {
  showToast("正在生成 PDF…");
  await loadScriptOnce(VENDOR+"html2canvas.min.js");
  await loadScriptOnce(VENDOR+"jspdf.umd.min.js");
  const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:"mm",format:"a4",compress:true});
  const pageW=210,pageH=297,margin=12,usableW=pageW-margin*2,usableH=pageH-margin*2;
  const clone=doc.cloneNode(true);
  const host=document.createElement("div");
  host.style.cssText="position:fixed;left:-10000px;top:0;width:820px;background:#fff;z-index:-1";
  clone.style.maxWidth="820px";clone.style.border="0";clone.style.padding="0 8px";
  clone.querySelectorAll(".rptToc").forEach(el=>el.remove());
  host.appendChild(clone);document.body.appendChild(host);
  const blocks=[];
  const cover=document.createElement("div");
  [...clone.children].filter(el=>!el.classList.contains("rptSec")).forEach(el=>cover.appendChild(el));
  clone.prepend(cover);
  blocks.push(cover);
  clone.querySelectorAll(".rptSec").forEach(sec=>{
    const parts=[...sec.children];
    let chunk=document.createElement("div");
    parts.forEach(el=>{
      if(el.tagName==="TABLE"&&el.rows.length>28) {
        const head=el.tHead?el.tHead.outerHTML:"";
        const bodyRows=[...el.tBodies[0].rows];
        for(let i=0;i<bodyRows.length;i+=28){
          const t=document.createElement("table");t.className=el.className;t.innerHTML=head+"<tbody>"+bodyRows.slice(i,i+28).map(r=>r.outerHTML).join("")+"</tbody>";
          chunk.appendChild(t);sec.appendChild(chunk);blocks.push(chunk);chunk=document.createElement("div");
        }
        el.remove();
      } else chunk.appendChild(el);
    });
    if(chunk.children.length){sec.appendChild(chunk);blocks.push(chunk);}
  });
  let y=margin,page=1;
  try {
    for(const block of blocks) {
      const canvas=await html2canvas(block,{scale:2,backgroundColor:"#ffffff",logging:false,useCORS:true});
      const h=canvas.height*usableW/canvas.width;
      if(y+h>pageH-margin&&y>margin){pdf.addPage();page++;y=margin;}
      if(h<=usableH){pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",margin,y,usableW,h);y+=h+2;continue;}
      const sliceH=Math.floor(canvas.width*usableH/usableW);
      for(let top=0;top<canvas.height;top+=sliceH){
        const part=document.createElement("canvas");part.width=canvas.width;part.height=Math.min(sliceH,canvas.height-top);
        part.getContext("2d").drawImage(canvas,0,top,canvas.width,part.height,0,0,canvas.width,part.height);
        const ph=part.height*usableW/part.width;
        if(y+ph>pageH-margin&&y>margin){pdf.addPage();page++;y=margin;}
        pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",margin,y,usableW,ph);y+=ph+2;
      }
    }
    const total=pdf.getNumberOfPages();
    for(let i=1;i<=total;i++){pdf.setPage(i);pdf.setFontSize(8);pdf.setTextColor(150);pdf.text(i+" / "+total,pageW/2,pageH-5,{align:"center"});}
    pdf.save(name+".pdf");showToast("已导出 PDF（"+total+" 页）");
  } finally {host.remove();}
}
function exportMenu(handler,formats=[["docx","Word"],["xlsx","Excel"],["csv","CSV"],["pdf","PDF"]],label="导出") {
  return '<div class="exportMenu"><button class="btn" type="button" onclick="toggleExportMenu(event,this)">'+label+' ▾</button><div class="menuPop" hidden>'+
    formats.map(([key,text])=>'<button type="button" onclick="'+handler+'(\''+key+'\')"><b>'+text+'</b><small>.'+key+'</small></button>').join("")+'</div></div>';
}
function toggleExportMenu(event,button){event.stopPropagation();const pop=button.nextElementSibling;const open=pop.hidden;closeExportMenus();pop.hidden=!open;}
function closeExportMenus(){document.querySelectorAll(".exportMenu .menuPop").forEach(pop=>pop.hidden=true);}
document.addEventListener("click",event=>{if(!event.target.closest(".exportMenu"))closeExportMenus();});

function pageTables() {

}

  else {const rows=[];sheets.forEach(sheet=>{if(sheets.length>1)rows.push([sheet.name]);rows.push(...sheet.rows,[]);});saveBlob(new Blob([csvText(rows)],{type:"text/csv;charset=utf-8"}),name+".csv");showToast("已导出 CSV");}
}
exportFirstTable = function () {exportPageTables("xlsx");};

// ---------- 长表格分页 ----------
const PAGER_STATE = {};
const PAGE_SIZE = 20;
function pagerKey(table,index){const panel=table.closest(".panel,.card");return state.top+"|"+state.group+"|"+state.page+"|"+(panel?.querySelector("h3")?.textContent||"")+"|"+index;}
function applyPagers() {
  document.querySelectorAll("#content .pager").forEach(el=>el.remove());
  [...document.querySelectorAll("#content table")].forEach((table,index)=>{
    if(table.closest(".rptDoc")||table.dataset.nopage!==undefined||!table.tBodies[0])return;
    const rows=[...table.tBodies[0].rows].filter(row=>!row.classList.contains("sumRow")&&!row.classList.contains("totalRow"));
    const size=Number(table.dataset.pageSize)||PAGE_SIZE;
    if(rows.length<=size)return;
    const key=pagerKey(table,index)+"|"+rows.length;
    const pages=Math.ceil(rows.length/size);
    let page=Math.min(PAGER_STATE[key]||1,pages);
    const show=()=>{rows.forEach((row,i)=>row.hidden=!(i>=(page-1)*size&&i<page*size));};
    show();
    const bar=document.createElement("div");bar.className="pager";
    const draw=()=>{
      const nums=[];for(let p=1;p<=pages;p++)if(p===1||p===pages||Math.abs(p-page)<=2)nums.push(p);else if(nums.at(-1)!=="…")nums.push("…");
      bar.innerHTML='<span>共 '+rows.length+' 条 · 第 '+((page-1)*size+1)+'–'+Math.min(page*size,rows.length)+' 条</span><div>'+
        '<button type="button" '+(page===1?'disabled':'')+' data-p="'+(page-1)+'">‹</button>'+nums.map(p=>p==="…"?'<em>…</em>':'<button type="button" class="'+(p===page?'active':'')+'" data-p="'+p+'">'+p+'</button>').join("")+
        '<button type="button" '+(page===pages?'disabled':'')+' data-p="'+(page+1)+'">›</button></div>';
    };
    bar.addEventListener("click",event=>{const p=Number(event.target.dataset?.p);if(!p)return;page=p;PAGER_STATE[key]=p;show();draw();});
    draw();
    (table.closest(".tableWrap")||table).after(bar);
  });
}
const renderBeforePager = render;
render = function () {
  renderBeforePager();
  try{applyPagers();}catch(error){console.error(error);}
};
