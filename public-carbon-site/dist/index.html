<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deloitte 碳排放管理系统 · 交互增强版</title>
  <style>
:root{
  --green:#86BC25;--green2:#6EA51E;--green3:#4D7F17;--greenLight:#F0F8E7;--greenSoft:#F8FCF3;
  --black:#000;--text:#1F2937;--sub:#667085;--line:#E5E7EB;--bg:#F6F8F5;--white:#fff;
  --blue:#2C6AA0;--teal:#008A7A;--orange:#E9A23B;--red:#D64545;--purple:#6750A4;
  --shadow:0 1px 2px rgba(16,24,40,.04)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;color:var(--text);font-size:14px}
button,input,select,textarea{font-family:inherit}
.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:900;color:#000;margin-right:30px;letter-spacing:-1px}
.logo:after{content:".";color:var(--green);font-size:34px;line-height:0}
.nav{display:flex;align-items:center;gap:2px;flex:1;height:64px}
.nav button{height:64px;background:transparent;border:0;border-bottom:3px solid transparent;padding:0 16px;font-size:15px;cursor:pointer;color:#2F3A45}
.nav button.active{border-bottom-color:var(--green);font-weight:800;color:#000}
.right{display:flex;align-items:center;gap:10px;color:#344054}
.right .pill{height:32px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 10px;display:flex;align-items:center}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--greenLight);color:var(--green3);font-weight:800;display:flex;align-items:center;justify-content:center}
.main{display:flex;min-height:calc(100vh - 64px)}
.sidebar{width:276px;background:#fff;border-right:1px solid var(--line);padding:16px 12px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side-title{font-size:12px;color:#98A2B3;letter-spacing:.06em;margin:6px 10px 12px}
.group{margin-bottom:8px}
.group-btn{width:100%;min-height:42px;text-align:left;border:0;background:#fff;border-radius:9px;padding:10px 11px;display:flex;gap:10px;align-items:center;cursor:pointer;font-weight:800;color:#24313D}
.group-btn:hover{background:#F7FAF4}
.group-btn.active{background:var(--greenLight);color:var(--green3)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(134,188,37,.14);flex:0 0 auto}
.sub{margin:4px 0 10px 28px;border-left:1px solid #E5EFD6;padding-left:9px}
.sub button{display:block;width:100%;border:0;background:transparent;text-align:left;padding:8px 8px;border-radius:8px;color:#5B6673;cursor:pointer;font-size:13px}
.sub button:hover{background:#F7FAF4;color:#1F2937}
.sub button.active{background:var(--greenLight);color:var(--green3);font-weight:800}
.content{flex:1;padding:22px 26px 36px;overflow:auto}
.breadcrumb{font-size:13px;color:#798390;margin-bottom:8px}
.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
h1{font-size:24px;margin:0 0 7px;color:#101828}
.desc{margin:0;color:#667085;line-height:1.55}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;color:#344054}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.soft{background:var(--greenLight);border-color:#D4E9B6;color:var(--green3)}
.btn.red{background:#FFF5F5;border-color:#F2C9C9;color:var(--red)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,minmax(160px,1fr));margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:16px}
.kpi{position:relative;overflow:hidden;min-height:118px}
.kpi:after{content:"";position:absolute;right:-24px;top:-28px;width:94px;height:94px;border-radius:50%;background:rgba(134,188,37,.13)}
.kpi .label{font-size:13px;color:#667085;margin-bottom:10px}
.kpi .value{font-size:26px;font-weight:900;color:#101828}
.kpi .note{font-size:12px;color:#667085;margin-top:8px}
.two{grid-template-columns:1.25fr .9fr}.twoEqual{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}
.card h3{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px;color:#101828}
.card h3:before{content:"";width:4px;height:16px;border-radius:3px;background:var(--green)}
.filters{display:grid;grid-template-columns:repeat(4,1fr) auto auto;gap:10px;align-items:end}
.field label{display:block;font-size:12px;color:#667085;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;height:36px;border:1px solid #D6DCE2;border-radius:8px;padding:0 10px;background:#fff}
.field textarea{height:76px;padding:10px;resize:none}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;white-space:nowrap;color:#5B6673;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.active{color:var(--green3);border-bottom-color:var(--green);font-weight:800}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
th{background:#F6FAEF;color:#405124;font-size:13px;font-weight:900}
tr:hover td{background:#FBFDF8}
.tableWrap{overflow:auto}
.status{display:inline-flex;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}
.ok{background:#EAF7E5;color:#3F7F16}.warn{background:#FFF7E6;color:#B7791F}.bad{background:#FFF1F1;color:#C53030}.info{background:#EAF4FF;color:#2C6AA0}.gray{background:#F2F4F7;color:#475467}
.progress{height:8px;background:#EAECF0;border-radius:99px;overflow:hidden;min-width:120px}.progress span{display:block;height:100%;background:var(--green);border-radius:99px}
.bars{height:210px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:13px;padding:16px 8px 0}.bar{flex:1;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#B7D779,#86BC25);position:relative}.bar b{position:absolute;top:-21px;left:50%;transform:translateX(-50%);font-size:12px;color:#667085}.xlabels{display:flex;gap:13px;padding:8px;color:#667085;font-size:12px;text-align:center}.xlabels span{flex:1}
.donutWrap{display:flex;gap:18px;align-items:center}.donut{width:152px;height:152px;border-radius:50%;background:conic-gradient(var(--green) 0 42%,var(--teal) 42% 65%,var(--blue) 65% 84%,#CBD5E1 84% 100%);position:relative}.donut:after{content:"";position:absolute;inset:28px;border-radius:50%;background:#fff}
.legend{flex:1;display:grid;gap:8px}.legend div{display:flex;justify-content:space-between;border-bottom:1px dashed #E5E7EB;padding-bottom:7px}.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.step{border:1px solid var(--line);border-radius:8px;background:#fff;padding:13px}.step:before{content:attr(data-n);display:flex;width:28px;height:28px;background:var(--green);color:#fff;border-radius:50%;align-items:center;justify-content:center;font-weight:900;margin-bottom:8px}.step h4{margin:0 0 7px}.step p{margin:0;color:#667085;font-size:13px;line-height:1.45}
.formGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.wide{grid-column:span 2}.full{grid-column:1/-1}
.treeLayout{display:grid;grid-template-columns:250px 1fr;gap:16px}.tree{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px}.tree ul{margin:0;padding-left:16px;list-style:none}.tree li{padding:8px 6px;border-radius:7px}.tree li.active{background:var(--greenLight);color:var(--green3);font-weight:900}.canvas{min-height:340px;border:1px dashed #BFD99A;border-radius:8px;background:#FBFDF8;padding:18px}.node{display:inline-flex;border:1px solid #BFD99A;border-radius:8px;background:#fff;padding:10px 14px;margin:10px;font-weight:800}.node.green{background:var(--greenLight);color:var(--green3)}.node.blue{background:#F0F7FF;border-color:#B9D7EF;color:#245B86}.node.teal{background:#EFFAF8;border-color:#AFE0D7;color:#087265}
.sankey{height:245px;border:1px solid var(--line);border-radius:8px;background:linear-gradient(90deg,#FBFDF8,#fff);position:relative;overflow:hidden}.flow{position:absolute;height:32px;border-radius:999px;background:rgba(134,188,37,.28);transform-origin:left center}.f1{left:80px;top:52px;width:440px;transform:rotate(5deg)}.f2{left:88px;top:120px;width:350px;transform:rotate(-8deg);background:rgba(0,138,122,.23)}.f3{left:110px;top:180px;width:300px;background:rgba(44,106,160,.2)}.sLabel{position:absolute;background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-weight:800;box-shadow:var(--shadow)}
.cover{background:linear-gradient(135deg,#fff 0%,#fff 55%,#F0F8E7 55%,#E4F3D0 100%);border:1px solid #DCEBCB;border-radius:8px;min-height:410px;padding:34px;position:relative;overflow:hidden}.cover:before{content:"";position:absolute;right:-100px;bottom:-120px;width:340px;height:340px;border-radius:50%;background:rgba(134,188,37,.22)}.coverLogo{font-size:32px;font-weight:900}.coverLogo:after{content:".";color:var(--green);font-size:42px}.coverTitle{font-size:28px;font-weight:900;margin:58px 0 12px;color:#111827}.coverSub{font-size:16px;color:#4B5563}.coverMeta{position:absolute;left:34px;bottom:30px;color:#667085;line-height:1.8}
.mapGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.map{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px;min-height:122px}.mapId{font-weight:900;color:var(--green3);font-size:18px;margin-bottom:8px}.mapFunc{font-weight:800;line-height:1.35;margin-bottom:7px}.mapMenu{font-size:12px;color:#667085;line-height:1.45}
.home{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:16px}.hero{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:28px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;right:-80px;top:-90px;width:230px;height:230px;border-radius:50%;background:rgba(134,188,37,.14)}.hero h1{font-size:31px;margin:12px 0 10px}.hero p{color:#5B6673;line-height:1.7}.badge{display:inline-flex;background:var(--greenLight);color:var(--green3);border-radius:999px;padding:4px 9px;font-weight:900;font-size:12px}.entryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.entry{border:1px solid #DCEBCB;border-radius:8px;background:#FBFDF8;padding:16px;cursor:pointer}.entry:hover{box-shadow:var(--shadow);transform:translateY(-1px)}.entry h3{margin:0 0 8px}.entry p{margin:0;color:#667085;font-size:13px;line-height:1.5}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mini{background:#FBFDF8;border:1px solid #E5EED7;border-radius:8px;padding:14px}.mini b{display:block;font-size:22px;margin:8px 0}
.iconGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.iconCard{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px}.icon{width:34px;height:34px;border-radius:8px;background:var(--greenLight);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green3);margin-bottom:10px}.iconCard b{display:block;margin-bottom:5px}.iconCard span{font-size:12px;color:#667085;line-height:1.45}
.footer{margin-top:18px;text-align:right;color:#98A2B3;font-size:12px}
@media(max-width:1240px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.twoEqual,.home{grid-template-columns:1fr}.mapGrid{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:repeat(2,1fr)}.iconGrid{grid-template-columns:repeat(2,1fr)}}

.realSankey{
  width:100%;
  height:360px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  overflow:hidden;
  position:relative;
}
.realSankey svg{width:100%;height:100%;display:block}
.realSankey .node rect{rx:3;ry:3}
.realSankey .node text{font-size:12px;fill:#344054;font-weight:700}
.realSankey .flowPath{fill:none;stroke-linecap:round;opacity:.62}
.realSankey .flowPath:hover{opacity:.86}
.realSankey .sankeyTip{
  position:absolute;left:300px;top:188px;background:#fff;border:1px solid #E4E7EC;border-radius:8px;
  box-shadow:0 8px 22px rgba(16,24,40,.14);padding:8px 10px;font-size:12px;color:#344054
}
.realSankey .sankeyTip b{color:#101828}


.realSankey{
  width:100%;
  height:390px;
  border:1px solid var(--line);
  border-radius:8px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FBFDF8 100%);
  overflow:hidden;
  position:relative;
}
.realSankey svg{width:100%;height:100%;display:block}
.realSankey .node rect{rx:4;ry:4}
.realSankey .node text{font-size:12px;fill:#344054;font-weight:700}
.realSankey .flowPath{fill:none;stroke-linecap:round;opacity:.50}
.realSankey .flowPath.main{opacity:.64}
.realSankey .flowPath:hover{opacity:.82}
.realSankey .stageTitle{font-size:13px;fill:#667085;font-weight:800}
.realSankey .valueLabel{font-size:11px;fill:#667085;font-weight:700}
.realSankey .captionBox{fill:#fff;stroke:#E5E7EB;stroke-width:1;rx:8;ry:8}
.realSankey .captionText{font-size:12px;fill:#475467;font-weight:700}


.helpHero{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:24px;
  margin-bottom:16px;
  display:grid;
  grid-template-columns:1.1fr .9fr;
  gap:18px;
  align-items:center;
  position:relative;
  overflow:hidden;
}
.helpHero:after{
  content:"";
  position:absolute;
  right:-90px;
  top:-100px;
  width:260px;
  height:260px;
  border-radius:50%;
  background:rgba(134,188,37,.13);
}
.helpHero h2{margin:0 0 8px;font-size:26px;color:#101828}
.helpHero p{margin:0 0 16px;color:#667085;line-height:1.65}
.helpSearch{
  height:42px;
  border:1px solid #D6DCE2;
  border-radius:8px;
  display:flex;
  align-items:center;
  padding:0 12px;
  background:#FBFDF8;
  max-width:560px;
}
.helpSearch span{font-size:18px;margin-right:8px;color:var(--green3)}
.helpSearch input{border:0;outline:none;background:transparent;flex:1;font-size:14px}
.helpHeroPanel{
  position:relative;
  z-index:1;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.helpMini{
  border:1px solid #DCEBCB;
  background:#FBFDF8;
  border-radius:8px;
  padding:14px;
}
.helpMini b{display:block;font-size:22px;margin-bottom:5px;color:#101828}
.helpMini span{font-size:12px;color:#667085}
.helpTileGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:16px;
}
.helpTile{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:16px;
  min-height:196px;
  cursor:pointer;
  transition:.16s ease;
  position:relative;
  overflow:hidden;
}
.helpTile:hover{transform:translateY(-2px);border-color:#CFE6AE;box-shadow:0 14px 30px rgba(16,24,40,.10)}
.helpTile svg{
  width:100%;
  height:94px;
  margin-bottom:12px;
  display:block;
  border-radius:8px;
  background:#F8FCF3;
}
.helpTile h3{font-size:16px;margin:0 0 7px;color:#101828}
.helpTile p{margin:0;color:#667085;font-size:13px;line-height:1.5}
.helpTile .openHint{
  position:absolute;
  right:14px;
  bottom:12px;
  color:var(--green3);
  font-weight:900;
  font-size:12px;
}
.helpGuideGrid{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:16px;
}
.helpSteps{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.helpStep{
  border:1px solid #E5E7EB;
  border-radius:8px;
  background:#fff;
  padding:13px;
}
.helpStep b{display:block;color:#101828;margin-bottom:6px}
.helpStep span{display:block;color:#667085;font-size:13px;line-height:1.45}
@media(max-width:1240px){
  .helpHero,.helpGuideGrid{grid-template-columns:1fr}
  .helpTileGrid{grid-template-columns:repeat(2,1fr)}
}


.helpContentGrid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:16px;
  margin-top:16px;
}
.helpListCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:16px;
}
.helpListHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}
.helpListHead h3{
  margin:0;
  font-size:16px;
  display:flex;
  align-items:center;
  gap:8px;
}
.helpListHead h3:before{
  content:"";
  width:4px;
  height:16px;
  background:var(--green);
  border-radius:3px;
}
.helpListHead a{
  color:var(--green3);
  font-size:12px;
  font-weight:800;
  text-decoration:none;
}
.faqList{
  display:grid;
  gap:8px;
}
.faqItem{
  border-bottom:1px solid #EEF2F6;
  padding:10px 0 11px;
  display:grid;
  grid-template-columns:22px 1fr auto;
  gap:8px;
  align-items:start;
  cursor:pointer;
}
.faqItem:hover{
  background:#FBFDF8;
  margin-left:-8px;
  margin-right:-8px;
  padding-left:8px;
  padding-right:8px;
  border-radius:8px;
}
.faqNo{
  width:18px;
  height:18px;
  border-radius:50%;
  background:var(--greenLight);
  color:var(--green3);
  font-size:11px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-top:1px;
}
.faqTitle{
  color:#344054;
  font-weight:700;
  line-height:1.45;
}
.faqTag{
  display:inline-flex;
  padding:3px 7px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
  background:#F2F4F7;
  color:#667085;
  white-space:nowrap;
}
.standardTabs{
  display:flex;
  gap:6px;
  margin-bottom:12px;
  border-bottom:1px solid #EEF2F6;
}
.standardTabs button{
  border:0;
  background:transparent;
  padding:8px 10px;
  color:#667085;
  font-weight:700;
  border-bottom:3px solid transparent;
}
.standardTabs button.active{
  color:var(--green3);
  border-bottom-color:var(--green);
}
.standardList{
  display:grid;
  gap:10px;
}
.standardItem{
  border:1px solid #EEF2F6;
  border-radius:8px;
  padding:12px;
  cursor:pointer;
  display:grid;
  grid-template-columns:1fr auto;
  gap:10px;
}
.standardItem:hover{
  border-color:#CFE6AE;
  background:#FBFDF8;
}
.standardItem b{
  display:block;
  margin-bottom:6px;
  color:#101828;
}
.standardItem span{
  display:block;
  color:#667085;
  font-size:12px;
  line-height:1.45;
}
.standardItem .arrow{
  color:var(--green3);
  font-weight:900;
  align-self:center;
}
.messagePanel{
  display:grid;
  gap:10px;
}
.messageItem{
  display:grid;
  grid-template-columns:34px 1fr auto;
  gap:10px;
  align-items:start;
  border-bottom:1px solid #EEF2F6;
  padding:10px 0;
  cursor:pointer;
}
.messageIcon{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#F0F8E7;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--green3);
  font-weight:900;
}
.messageItem b{
  display:block;
  color:#101828;
  margin-bottom:5px;
}
.messageItem span{
  display:block;
  color:#667085;
  font-size:12px;
  line-height:1.45;
}
.messageTime{
  color:#98A2B3;
  font-size:12px;
  white-space:nowrap;
}
@media(max-width:1240px){
  .helpContentGrid{grid-template-columns:1fr}
}


.supplyBoardGrid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:16px;
  align-items:start;
}
.horizontalChart{
  display:grid;
  gap:10px;
  margin-top:6px;
}
.hbarRow{
  display:grid;
  grid-template-columns:92px 1fr 46px;
  gap:10px;
  align-items:center;
}
.hbarLabel{
  color:#475467;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.hbarTrack{
  height:12px;
  background:#EEF2F6;
  border-radius:999px;
  overflow:hidden;
  position:relative;
}
.hbarFill{
  height:100%;
  border-radius:999px;
  background:linear-gradient(90deg,#CFE6AE,#86BC25);
}
.hbarFill.blue{background:linear-gradient(90deg,#B9D7EF,#2C6AA0)}
.hbarFill.orange{background:linear-gradient(90deg,#FFE0A3,#E9A23B)}
.hbarValue{
  font-size:12px;
  color:#667085;
  text-align:right;
  font-weight:800;
}
.chartLegend{
  display:flex;
  gap:16px;
  margin-top:12px;
  color:#667085;
  font-size:12px;
}
.chartLegend i{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  margin-right:6px;
}
.riskTabs{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-bottom:8px;
  font-size:12px;
}
.riskTabs span{
  padding:4px 8px;
  border-radius:999px;
  color:#667085;
  background:#F2F4F7;
  font-weight:700;
}
.riskTabs span.active{
  color:var(--green3);
  background:var(--greenLight);
}
.indicatorTable table{
  min-width:640px;
}
.indicatorTable th{
  background:#9CC45A;
  color:#fff;
}
.riskTable th{
  background:#F6FAEF;
}
.supplyAlert{
  display:flex;
  align-items:center;
  gap:8px;
  background:#FFF7E6;
  border:1px solid #F7D89C;
  color:#936B15;
  padding:10px 12px;
  border-radius:8px;
  margin-bottom:14px;
  font-size:13px;
}
.supplyAlert b{color:#7A4B00}


/* v10 supply chain dashboard layout refinement */
.supplyBoardGrid{
  grid-template-columns:minmax(0,1fr);
  gap:16px;
}
.supplyTopGrid{
  display:grid;
  grid-template-columns:minmax(420px,.92fr) minmax(520px,1.08fr);
  gap:16px;
  align-items:stretch;
}
.supplyBottomGrid{
  display:grid;
  grid-template-columns:minmax(0,1fr);
  gap:16px;
}
.supplyBoardGrid .card{
  min-width:0;
}
.indicatorTable table{
  min-width:980px;
}
.riskTable table{
  min-width:880px;
}
.supplyCompactKpis{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:16px;
  margin-bottom:16px;
}
.supplyCompactKpis .kpi{
  min-height:104px;
}
.supplyCompactKpis .kpi .value{
  font-size:24px;
}
.supplyChartCard{
  min-height:416px;
}
.supplyIndicatorCard{
  min-height:416px;
}
.supplyRiskCard{
  width:100%;
}
.hbarRow{
  grid-template-columns:98px minmax(0,1fr) 46px;
}
@media(max-width:1380px){
  .supplyTopGrid{grid-template-columns:1fr}
  .supplyCompactKpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}

.toast{
  position:fixed;
  right:24px;
  bottom:24px;
  z-index:80;
  max-width:380px;
  padding:11px 14px;
  background:#101828;
  color:#fff;
  border-radius:8px;
  box-shadow:0 14px 32px rgba(16,24,40,.22);
  opacity:0;
  transform:translateY(12px);
  pointer-events:none;
  transition:.18s ease;
}
.toast.show{
  opacity:1;
  transform:translateY(0);
}
.modalMask{
  position:fixed;
  inset:0;
  z-index:70;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  background:rgba(16,24,40,.42);
}
.modalMask[hidden]{
  display:none;
}
.modalBox{
  width:min(820px,100%);
  max-height:calc(100vh - 48px);
  overflow:auto;
  background:#fff;
  border-radius:8px;
  box-shadow:0 24px 70px rgba(16,24,40,.28);
  padding:22px;
  position:relative;
}
.modalBox h2{
  margin:0 44px 16px 0;
  font-size:20px;
  color:#101828;
}
.modalClose{
  position:absolute;
  right:16px;
  top:14px;
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:8px;
  background:#fff;
  color:#667085;
  font-size:20px;
  cursor:pointer;
}
.modalForm{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:14px;
}
.modalForm label{
  display:grid;
  gap:6px;
  color:#475467;
  font-weight:700;
}
.modalForm input,.modalForm textarea{
  width:100%;
  border:1px solid #D6DCE2;
  border-radius:8px;
  min-height:38px;
  padding:8px 10px;
}
.modalForm textarea{
  grid-column:1/-1;
  min-height:86px;
  resize:vertical;
}
.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:16px;
}
.modalText{
  color:#475467;
  line-height:1.7;
  white-space:pre-line;
}
.filtersCollapsed .filters .field:nth-child(n+3){
  display:none;
}
.filtersCollapsed{
  padding-bottom:12px;
}
tr.rowHighlight td{
  background:#F0F8E7!important;
}
tr.rowRemoving{
  opacity:.25;
  transform:translateX(12px);
  transition:.18s ease;
}
.faqAnswer{
  margin:-4px 0 8px 30px;
  padding:10px 12px;
  border-left:3px solid var(--green);
  background:#FBFDF8;
  color:#667085;
  border-radius:0 10px 10px 0;
  line-height:1.55;
}
.standardTabs button,
.riskTabs span,
.faqItem,
.standardItem,
.messageItem{
  user-select:none;
}

.orgFlow{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
  margin:0 0 16px;
}
.orgFlow button{
  border:1px solid #DCEBCB;
  background:#FBFDF8;
  color:#405124;
  border-radius:8px;
  padding:10px 8px;
  font-weight:900;
  cursor:pointer;
}
.orgFlow button:hover{
  background:var(--greenLight);
  border-color:#BFD99A;
}
.orgActionGrid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:16px;
}
.orgActionCard{
  border:1px solid var(--line);
  background:#fff;
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:16px;
  min-height:156px;
  cursor:pointer;
  display:grid;
  gap:9px;
  align-content:start;
}
.orgActionCard.highlight{
  border-color:#CFE6AE;
  background:#FBFDF8;
}
.orgActionCard b{
  color:#101828;
  font-size:17px;
}
.orgActionCard span{
  color:#667085;
  line-height:1.55;
}
.orgActionCard em{
  color:var(--green3);
  font-style:normal;
  font-weight:900;
  margin-top:auto;
}
.entryPanel{
  display:grid;
  grid-template-columns:260px 1fr;
  gap:16px;
  margin-bottom:16px;
}
.entrySteps{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:14px;
  display:grid;
  gap:10px;
  align-content:start;
}
.entrySteps b{
  border:1px solid #EEF2F6;
  border-radius:8px;
  padding:10px;
  color:#667085;
  background:#fff;
}
.entrySteps b.active{
  color:var(--green3);
  border-color:#CFE6AE;
  background:var(--greenLight);
}
.scopeFillLayout{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:16px;
  margin-bottom:16px;
}
.sourceSplit{
  display:grid;
  gap:12px;
}
.sourceSplit div{
  border:1px solid #E5E7EB;
  border-radius:8px;
  padding:13px;
  background:#fff;
  display:grid;
  gap:5px;
}
.sourceSplit b{
  color:#101828;
}
.sourceSplit span{
  color:#667085;
  line-height:1.45;
}
.sourceSplit em{
  color:var(--green3);
  font-style:normal;
  font-weight:900;
}
.linkageBoard{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-bottom:16px;
}
.linkageCard{
  background:#fff;
  border:1px solid var(--line);
  border-radius:8px;
  box-shadow:var(--shadow);
  padding:15px;
  display:grid;
  gap:10px;
  min-height:188px;
}
.linkageCard.ready{
  border-color:#CFE6AE;
  background:#FBFDF8;
}
.linkageCard b,.linkageCard strong{
  color:#101828;
}
.linkageCard span,.linkageCard p{
  display:block;
  color:#667085;
  line-height:1.45;
  margin:0;
}
.linkageCard button{
  align-self:end;
}
.btn:disabled{
  cursor:not-allowed;
  opacity:.55;
}
.cleanFillLayout{
  display:grid;
  grid-template-columns:minmax(0,1fr) 280px;
  gap:14px;
  align-items:start;
  margin-bottom:14px;
}
.cleanFillLayout .card,
.compactForm,
.assistCard{
  box-shadow:none;
  border-radius:8px;
}
.assistCard{
  position:sticky;
  top:82px;
}
.assistList{
  display:grid;
  gap:10px;
}
.assistList div{
  border-bottom:1px solid #EEF2F6;
  padding-bottom:10px;
}
.assistList div:last-child{
  border-bottom:0;
  padding-bottom:0;
}
.assistList b{
  display:block;
  color:#101828;
  margin-bottom:4px;
}
.assistList span{
  color:#667085;
  line-height:1.45;
  font-size:13px;
}
.compactForm{
  margin-bottom:14px;
}
.helpIcon{
  width:20px;
  height:20px;
  border:1px solid #CFE6AE;
  border-radius:50%;
  background:var(--greenLight);
  color:var(--green3);
  font-size:12px;
  font-weight:900;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  margin-left:6px;
  padding:0;
  vertical-align:middle;
  cursor:pointer;
}
.helpIcon:hover{
  background:var(--green);
  border-color:var(--green);
  color:#fff;
}

.scopeSwitch{
  display:grid;
  grid-template-columns:minmax(220px,320px) 1fr auto;
  gap:16px;
  align-items:end;
  margin-bottom:16px;
  background:linear-gradient(180deg,#FFFFFF 0%,#FBFDF8 100%);
}
.scopeSwitch b{
  display:block;
  margin-bottom:4px;
  color:#101828;
}
.scopeCategoryGrid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}
.scopeCategory{
  min-height:92px;
  border:1px solid #E5E7EB;
  border-radius:8px;
  background:#fff;
  padding:11px;
  display:grid;
  gap:5px;
  align-content:start;
}
.scopeCategory.active{
  border-color:#CFE6AE;
  background:#FBFDF8;
  box-shadow:inset 0 0 0 1px rgba(134,188,37,.12);
}
.scopeCategory b{
  color:var(--green3);
  font-size:13px;
}
.scopeCategory span{
  color:#344054;
  font-weight:800;
  line-height:1.35;
  white-space:normal;
}
.scopeCategory em{
  color:#667085;
  font-style:normal;
  font-size:12px;
  line-height:1.35;
}
@media(max-width:1240px){
  .orgFlow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .orgActionGrid,.linkageBoard{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entryPanel,.scopeFillLayout,.cleanFillLayout{grid-template-columns:1fr}
  .assistCard{position:static}
  .scopeSwitch{grid-template-columns:1fr}
  .scopeCategoryGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:760px){
  .orgFlow,.orgActionGrid,.linkageBoard{grid-template-columns:1fr}
  .scopeCategoryGrid{grid-template-columns:1fr}
}

.card{border-radius:8px;box-shadow:none;margin-bottom:14px}
.logo{letter-spacing:0}
.chartControls{display:flex;justify-content:flex-end;margin-bottom:8px}
.chartControls select,.modalForm select{height:34px;border:1px solid #d6dce2;border-radius:6px;padding:0 8px;background:white;max-width:100%}
.bar,.hbarFill,.flowPath{transition:height .5s,width .5s,stroke-width .5s}
.bar:hover,.hbarRow:hover,.flowPath:hover{filter:brightness(.9)}
.realSankey .flowPath{stroke-dasharray:12 4;animation:flowTravel 2s linear infinite}
@keyframes flowTravel{to{stroke-dashoffset:-32}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.content{min-width:0}
.sidebar{flex-shrink:0}
.head .desc:empty{display:none}
.kpi .value{overflow-wrap:anywhere}
.modalBox{width:min(960px,94vw);max-height:90vh;overflow:auto}
.modalForm select{width:100%}
.lcaMeta{display:flex;flex-wrap:wrap;gap:14px;padding:14px 0;border-bottom:1px solid #e5e7eb;margin-bottom:16px;color:#475467}
.lcaStageTabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:20px}
.lcaStageTabs button{border:1px solid #d6dce2;background:white;border-radius:6px;padding:14px 10px;text-align:left;cursor:pointer;font-size:14px}
.lcaStageTabs button.active{border-color:#86bc25;background:#f0f8e7;color:#405124}
.lcaStageTabs small{display:block;margin-top:8px;font-size:12px}
.lcaStageHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px}
.lcaStageHead h3{margin:0}
.lcaFooter{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lcaBoundaryStages{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.lcaBoundaryStages label{display:flex;gap:4px;align-items:center}
.lcaContribution{display:grid;grid-template-columns:110px minmax(60px,1fr) 190px 70px;gap:16px;align-items:center;background:white;border:0;width:100%;padding:16px 0;text-align:left;cursor:pointer;border-bottom:1px solid #eef2f6}
.lcaContribution:hover{background:#f8fcf3}
.lcaTrack{height:16px;background:#f2f4f7;border-radius:3px;overflow:hidden}
.lcaTrack i{display:block;height:100%;min-width:2px;transition:width .4s}
.lcaReport{background:white;border-top:5px solid #86bc25;padding:28px;margin-bottom:18px}
.lcaReport dl{display:grid;grid-template-columns:120px 1fr;gap:12px;line-height:1.6}
.lcaReport dd{margin:0}.lcaReport dt{color:#667085}
.head select{height:36px;max-width:280px;border:1px solid #d6dce2;border-radius:6px;background:white;padding:0 8px}
.sidebar{width:196px;padding:12px 8px}
.sidebar .group-btn{font-size:13px;min-height:38px;padding:9px 8px;border-radius:5px;gap:8px}
.sidebar .sub{margin-left:21px;padding-left:7px}
.sidebar .sub button{font-size:12px;padding:7px 6px}
.navMark{font-size:17px;width:22px;flex-shrink:0;text-align:center}
.shellIcon{width:32px;height:32px;border:1px solid #e5e7eb;background:white;border-radius:5px;cursor:pointer;margin-right:14px;font-size:17px}
.topbar .logo{margin-right:14px}
.sidebarCollapsed .sidebar{width:58px;padding:12px 5px}
.sidebarCollapsed .sidebar .navLabel,.sidebarCollapsed .side-title,.sidebarCollapsed .sidebar .sub{display:none}
.sidebarCollapsed .sidebar .group-btn{justify-content:center}
#roleSelect{height:32px;border:1px solid #d6dce2;border-radius:5px;background:white;padding:0 8px}
.taskToolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px 0 18px}
.taskToolbar label{display:grid;gap:5px;font-size:12px;color:#667085}
.taskToolbar select,.taskToolbar input{height:36px;border:1px solid #d6dce2;border-radius:5px;padding:0 10px;background:white;color:#1f2937}
.taskSearch input{width:240px}
.taskToolbar>span{margin-left:auto;font-size:12px;color:#667085;padding-bottom:10px}
.taskTable{background:white;border:1px solid #e5e7eb;border-radius:6px}
.taskTable small{display:block;color:#667085;margin-top:5px;font-size:11px}
.taskTable strong{font-weight:600}
.taskContext{display:flex;gap:12px;flex-wrap:wrap;align-items:center;font-size:13px;color:#667085;margin:0 0 18px}
.reviewNote{background:#fff7e6;padding:12px;color:#936b15}
.calculationHelp{padding:12px 0;border-bottom:1px solid #e5e7eb;color:#667085;font-size:13px}
.calculationHelp summary{cursor:pointer;color:#405124}
.modalActions input{min-width:180px;padding:8px;border:1px solid #d6dce2;border-radius:5px}
.emptyState{padding:40px;text-align:center;color:#667085;background:white;border:1px solid #e5e7eb}
.lifecycleSankey{overflow:auto}
.lifecycleSankey svg{width:100%;min-width:920px;display:block}
.lifecycleSankey text{font-family:inherit;font-size:13px;fill:#344054}
.lifecycleSankey .sankeyValue{font-size:11px;fill:#667085}
.lifecycleSankey .sankeyColumn{font-weight:600;fill:#667085}
.lifecycleSankey .sankeyTotal{font-weight:700;fill:#101828;font-size:17px}
.sankeyItem{cursor:pointer}
.sankeyItem:hover path{stroke-opacity:.75}
.sankeyItem path{transition:stroke-opacity .2s}
@media(max-width:760px){
  .topbar{height:auto;padding:8px 12px;flex-wrap:wrap;position:relative}
  .nav{order:3;overflow:auto;flex-basis:100%;height:44px}
  .nav button{height:44px;white-space:nowrap}
  .right .pill{display:none}
  .main{display:block}
  .sidebar{width:100%;height:auto;position:static;padding:8px}
  .sidebar .sub{display:flex;flex-wrap:wrap;margin:4px 0;padding:0;border:0;max-width:340px}
  .sidebar .sub button{width:auto}
  .sidebar #side{display:flex;overflow:auto}
  .sidebar .group{flex-shrink:0}
  .content{padding:14px}
  .formGrid,.modalForm,.three,.timeline{grid-template-columns:1fr}
  .wide{grid-column:auto}
  .head{display:block}
  .head .actions{justify-content:flex-start;margin-top:12px}
  .home,.two,.twoEqual{grid-template-columns:1fr}
  .lcaStageTabs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .lcaContribution{grid-template-columns:80px 1fr;gap:8px}
  .lcaReport dl{grid-template-columns:1fr}
  .sidebar,.sidebarCollapsed .sidebar{width:100%;height:auto}
  .sidebarCollapsed .sidebar .navLabel{display:inline}
  .taskSearch input{width:200px}
}

/* role experience */
body[data-top="首页"] .sidebar{display:none}
.reportPreview{background:#fff;border:1px solid var(--line);border-top:5px solid var(--green);border-radius:8px;padding:26px 28px;margin-bottom:16px}
.reportCover .coverLogo{font-weight:900;font-size:22px}
.reportCover h2{margin:12px 0 4px;font-size:22px}.reportCover p{margin:0 0 16px;color:var(--sub)}
.reportFacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 24px;margin:0 0 8px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.reportFacts dt{color:var(--sub);font-size:12px}.reportFacts dd{margin:3px 0 0}
.reportPreview h3{font-size:15px;margin:20px 0 8px;border-left:3px solid var(--green);padding-left:8px}
.reportPreview table{width:100%;border-collapse:collapse}.reportPreview th,.reportPreview td{padding:8px;border-bottom:1px solid #EEF2F6;text-align:left;font-size:13px}
.reportPreview th{background:var(--greenSoft);color:#405124}
@media(max-width:760px){.reportFacts{grid-template-columns:1fr}.reportPreview{padding:18px}}
body:not([data-role="管理者"]) #content button[onclick*="editLcaModel"],body:not([data-role="管理者"]) #content button[onclick*="removeLcaLine"]{display:none}
.supplierProgress .flowSteps li:not(.now):not(.back){font-size:0;padding-right:14px}
.supplierProgress .flowSteps{flex-wrap:nowrap}
body[data-top="首页"] #sidebarToggle{visibility:hidden}
#identitySelect{height:30px;border:0;background:transparent;font-weight:700;color:#344054;max-width:180px}
.right .pill{gap:6px}
.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.welcome h1{margin:0 0 6px;font-size:24px}
.welcome p{margin:0;color:var(--sub);font-size:13px}
.statRow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.statTile{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:6px;min-width:0}
.statTile.clickable{cursor:pointer;transition:border-color .2s,box-shadow .2s}
.statTile.clickable:hover,.statTile.clickable:focus{border-color:#B9DB86;box-shadow:0 4px 14px rgba(77,127,23,.10);outline:0}
.statTile span{color:var(--sub);font-size:12px}
.statTile b{font-size:26px;line-height:1.1;font-weight:700;color:#101828;overflow-wrap:anywhere}
.statTile small{color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.homeGrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.homeGrid.even{grid-template-columns:repeat(2,minmax(0,1fr))}
.homeGrid>div{display:grid;gap:16px;min-width:0}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.panelHead h3{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.panelHead h3 em{font-style:normal;background:var(--greenLight);color:var(--green3);border-radius:10px;padding:1px 8px;font-size:12px}
.linkBtn{border:0;background:none;color:var(--green3);cursor:pointer;font-size:13px}
.todoList,.feed,.supplierProgress{list-style:none;margin:0;padding:0}
.todoList li{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid #EEF2F6}
.todoList li:first-child{border-top:0}
.todoMain{display:grid;gap:3px;min-width:0}
.todoMain b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.todoMain small{color:var(--sub);font-size:12px}
.todoMain em{font-style:normal;color:#936B15;font-size:12px;background:#FFF7E6;padding:3px 6px;border-radius:4px;justify-self:start}
.todoTag{display:inline-block;text-align:center;font-size:12px;padding:3px 6px;border-radius:4px;background:#F2F4F7;color:#475467;white-space:nowrap}
.todoTag.warn{background:#FFF4DE;color:#A66A00}.todoTag.bad{background:#FDECEC;color:var(--red)}.todoTag.ok{background:var(--greenLight);color:var(--green3)}
.todoEmpty{padding:18px 0;color:var(--sub);text-align:center;font-size:13px}
.feed li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid #EEF2F6;font-size:13px}
.feed li:first-child{border-top:0}
.feed time{grid-row:span 2;color:var(--sub);font-size:12px;white-space:nowrap}
.feed span{color:var(--green3);font-size:12px}
.quickLinks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.quickLinks button{display:grid;grid-template-columns:28px 1fr;gap:2px 8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:6px;padding:10px;cursor:pointer}
.quickLinks button:hover{border-color:#B9DB86;background:var(--greenSoft)}
.quickLinks span{grid-row:span 2;font-size:18px;color:var(--green3);align-self:center;text-align:center}
.quickLinks b{font-size:13px;font-weight:600}.quickLinks small{color:var(--sub);font-size:12px}
.progressList,.meterList{display:grid;gap:4px}
.progressRow,.meterRow{display:grid;grid-template-columns:88px minmax(40px,1fr) 92px;gap:10px;align-items:center;border:0;background:none;padding:8px 4px;border-radius:5px;cursor:pointer;text-align:left;width:100%}
.meterRow{grid-template-columns:minmax(90px,170px) minmax(40px,1fr) 118px}
.progressRow:hover,.meterRow:hover{background:var(--greenSoft)}
.progressTrack,.meterTrack{height:8px;background:#EEF1F4;border-radius:4px;overflow:hidden}
.progressTrack i,.meterTrack i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .4s}
.progressValue,.meterValue{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.progressValue small,.meterValue small,.meterLabel small{display:block;color:var(--sub);font-size:11px}
.meterLabel{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.flowSteps{display:flex;list-style:none;margin:6px 0 14px;padding:0;gap:0;counter-reset:step;flex-wrap:wrap}
.flowSteps li{display:flex;align-items:center;gap:6px;font-size:12px;color:#98A2B3;padding-right:22px;position:relative}
.flowSteps li:not(:last-child):after{content:"";position:absolute;right:6px;top:50%;width:10px;height:1px;background:#D0D5DD}
.flowSteps i{width:20px;height:20px;border-radius:50%;border:1px solid #D0D5DD;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;background:#fff}
.flowSteps li.done{color:var(--green3)}.flowSteps li.done i{background:var(--green);border-color:var(--green);color:#fff}
.flowSteps li.now{color:#101828;font-weight:600}.flowSteps li.now i{border-color:var(--green);color:var(--green3)}
.flowSteps li.back{color:var(--red);font-weight:600}.flowSteps li.back i{border-color:var(--red);color:var(--red)}
.calcPreview{margin:4px 0 8px;padding:10px 12px;background:var(--greenSoft);border:1px solid #E1EFCC;border-radius:6px;color:#405124;font-size:13px}
.supplierTask{background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:8px;padding:18px 20px;margin-bottom:16px}
.supplierTaskHead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.supplierTaskHead h2{margin:8px 0 4px;font-size:20px}.supplierTaskHead p{margin:0 0 10px;color:var(--sub);font-size:13px}
.btn.big{height:40px;padding:0 20px;font-size:14px}
.factGrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:8px 0 0}
.factGrid div{background:#F9FAFB;border-radius:6px;padding:10px 12px}
.factGrid dt{color:var(--sub);font-size:12px}.factGrid dd{margin:4px 0 0;font-weight:600}
.bigFigure b{font-size:30px;font-weight:700}.bigFigure span{margin-left:8px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.segTabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.segTabs button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:6px 14px;cursor:pointer;font-size:13px}
.segTabs button.active{background:var(--greenLight);border-color:#C7E39C;color:var(--green3);font-weight:600}
.segTabs em{font-style:normal;color:var(--sub);margin-left:2px}
.scopeStack{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:-4px 0 16px;gap:2px}
.scopeStack i{cursor:pointer;min-width:3px}
.supplierProgress>li{display:grid;grid-template-columns:150px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid #EEF2F6}
.supplierProgress>li:first-child{border-top:0}
.supplierProgress>li>div{display:grid;gap:3px}.supplierProgress small{color:var(--sub);font-size:12px}
.supplierProgress .flowSteps{margin:0}
.emptyCell{text-align:center;color:var(--sub);padding:28px}
.rowActions{white-space:nowrap}.rowActions .btn+.btn{margin-left:6px}
.taskTable td small{display:block}
@media(max-width:1100px){.homeGrid,.homeGrid.even{grid-template-columns:1fr}.supplierProgress>li{grid-template-columns:1fr}}
@media(max-width:760px){
  .statRow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .factGrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .supplierTaskHead{display:block}.supplierTaskHead .btn{margin-top:8px}
  .todoList li{grid-template-columns:54px minmax(0,1fr)}.todoList li .btn{grid-column:2;justify-self:start}
  .quickLinks{grid-template-columns:1fr}
  .meterRow{grid-template-columns:minmax(80px,120px) minmax(30px,1fr) 90px}
  #identitySelect{max-width:120px}
}

/* ===== home portal ===== */
.welcome.compact{align-items:center;margin-bottom:16px}
.welcome.compact h1{font-size:22px;margin:0 0 4px}
.homeTop{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px;margin-bottom:16px;align-items:stretch}
.carousel{position:relative;overflow:hidden;border-radius:8px;border:1px solid var(--line);background:#fff;min-height:300px}
.slides{display:flex;height:100%;transition:transform .6s ease}
.slide{flex:0 0 100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);min-height:300px}
.slideText{padding:28px 28px 48px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:10px}
.slideKicker{font-size:12px;color:var(--green3);font-weight:600;letter-spacing:.04em}
.slideText h2{margin:0;font-size:22px;line-height:1.35;color:#101828}
.slideText p{margin:0 0 6px;color:var(--sub);font-size:13px;line-height:1.7}
.slideArt{position:relative;overflow:hidden}
.slideArt svg{position:absolute;inset:0;width:100%;height:100%}
.blade{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{fill-opacity:.32}}
.slideNav{position:absolute;left:28px;bottom:14px;display:flex;align-items:center;gap:8px}
.slideNav i{width:8px;height:8px;border-radius:4px;background:#D0D5DD;cursor:pointer;transition:width .3s,background .3s}
.slideNav i.on{width:22px;background:var(--green)}
.slideNav button{border:1px solid var(--line);background:#fff;border-radius:50%;width:24px;height:24px;line-height:20px;cursor:pointer;color:#475467;padding:0}
.taskWidget{display:flex;flex-direction:column;margin:0}
.taskCounts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.taskCounts button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:8px 4px;cursor:pointer;display:grid;gap:2px;text-align:center}
.taskCounts button:hover{border-color:#B9DB86}
.taskCounts b{font-size:20px;line-height:1.2;color:#101828}.taskCounts span{font-size:12px;color:var(--sub)}
.taskCounts .warn b{color:#A66A00}.taskCounts .bad b{color:var(--red)}.taskCounts .ok b{color:var(--green3)}
.miniProgress{display:flex;align-items:center;gap:10px;margin:12px 0 8px}
.miniProgress span{flex:1;height:6px;background:#EEF1F4;border-radius:3px;overflow:hidden}
.miniProgress i{display:block;height:100%;background:var(--green)}
.miniProgress small{font-size:12px;color:var(--sub);white-space:nowrap}
.miniTabs{display:flex;gap:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.miniTabs button{border:0;background:none;padding:8px 0;border-bottom:2px solid transparent;cursor:pointer;color:#475467;font-size:13px}
.miniTabs button.active{border-bottom-color:var(--green);color:#101828;font-weight:600}
.miniTabs em{font-style:normal;color:var(--sub);font-size:12px}
.miniList{list-style:none;margin:0;padding:0}
.miniList li{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #F0F2F5}
.miniList li:last-child{border-bottom:0}
.miniList li>div{display:grid;gap:2px;min-width:0}
.miniList b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniList small{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.miniList .btn{height:28px;padding:0 10px;font-size:12px}
.moreLink{margin-top:6px;align-self:flex-start}
.supplierMini{display:grid;gap:4px;margin-bottom:6px}.supplierMini b{font-size:17px}.supplierMini small{color:var(--sub);font-size:12px}
.supplierMini .todoTag{justify-self:start}
.reviewNote.small{font-size:12px;padding:8px 10px;margin:0 0 8px}
.miniFacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.miniFacts div{background:#F9FAFB;border-radius:6px;padding:8px 10px}.miniFacts dt{font-size:12px;color:var(--sub)}.miniFacts dd{margin:2px 0 0;font-weight:600}
.btn.wide{width:100%;margin-top:auto}
.quickStrip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.quickStrip button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid var(--line);background:#fff;border-radius:18px;cursor:pointer;font-size:13px;color:#344054}
.quickStrip button:hover{border-color:#B9DB86;background:var(--greenSoft);color:var(--green3)}
.quickStrip span{color:var(--green3)}
.marketPanel{margin:0}
.demoBadge{font-size:12px;color:#A66A00;background:#FFF4DE;border-radius:4px;padding:2px 8px}
.marketGrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px}
.quoteRow{display:flex;justify-content:space-between;align-items:flex-end}
.quoteRow small{display:block;font-size:12px;color:var(--sub)}
.quoteRow b{font-size:28px;font-weight:700;color:#101828;margin-right:4px}.quoteRow span{color:var(--sub);font-size:12px}
.quoteRow em{font-style:normal;font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px}
.quoteRow em.up{color:#C0392B;background:#FDECEC}.quoteRow em.down{color:var(--green3);background:var(--greenLight)}
.spark{width:100%;height:86px;display:block;margin:10px 0}
.quoteFacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0}
.quoteFacts dt{font-size:11px;color:var(--sub)}.quoteFacts dd{margin:2px 0 0;font-weight:600;font-size:13px}
.newsWindow{height:190px;overflow:hidden;position:relative;border-left:1px solid var(--line);padding-left:20px;mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.newsScroll{list-style:none;margin:0;padding:0;animation:newsUp 30s linear infinite}
.newsWindow:hover .newsScroll{animation-play-state:paused}
@keyframes newsUp{to{transform:translateY(-50%)}}
.newsScroll button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 0;border-bottom:1px dashed #E4E7EC;cursor:pointer;font-size:13px;color:#344054}
.newsScroll button:hover{color:var(--green3)}
.newsTag{flex-shrink:0;font-size:11px;padding:1px 6px;border-radius:3px;background:var(--greenLight);color:var(--green3)}

/* ===== unified layout system ===== */
.main{background:linear-gradient(90deg,#fff 196px,var(--line) 196px,var(--line) 197px,transparent 197px)}
.sidebarCollapsed .main{background:linear-gradient(90deg,#fff 58px,var(--line) 58px,var(--line) 59px,transparent 59px)}
body[data-top="首页"] .main{background:none}
.content{padding:24px 28px 40px}
.breadcrumb{font-size:12px;color:#8A94A3;margin-bottom:6px}
.head{align-items:center;margin-bottom:16px;min-height:36px}
.head h1,.content h1{font-size:22px;font-weight:700;margin:0;line-height:1.3}
.head .actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{height:34px;padding:0 14px;border-radius:6px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;line-height:1}
td .btn,.rowActions .btn{height:30px;padding:0 12px;font-size:12px}
td .btn+.btn{margin-left:6px}
.helpIcon{width:24px;height:24px;flex-shrink:0}
.content select,.content input:not([type=checkbox]):not([type=radio]):not([type=file]),.modalForm input,.modalForm select,.modalActions input,#roleSelect,.head select{height:34px;border:1px solid #D0D5DD;border-radius:6px;padding:0 10px;background:#fff;color:#1F2937;font-size:13px}
.content textarea,.modalForm textarea{border:1px solid #D0D5DD;border-radius:6px;padding:8px 10px;font-size:13px}
.content select:focus,.content input:focus,.modalForm input:focus,.modalForm select:focus,.content textarea:focus{outline:0;border-color:var(--green);box-shadow:0 0 0 3px rgba(134,188,37,.15)}
.lcaMeta{align-items:center;gap:16px;padding:0 0 16px;font-size:13px}
.lcaMeta label{display:inline-flex;align-items:center;gap:8px}
.taskToolbar{padding:0 0 16px}
.taskToolbar>span{padding-bottom:9px}
.card,.panel,.taskTable,.statTile,.kpi,.lcaReport,.reportPreview,.supplierTask,.emptyState{border-radius:8px;border:1px solid var(--line);box-shadow:none;background:#fff}
.card,.panel{padding:16px;margin-bottom:16px}
.homeGrid>div>.panel,.homeGrid>div>.card,.homeTop>.panel,.marketPanel{margin-bottom:0}
.card h3,.panelHead h3{font-size:15px;font-weight:600;margin:0;display:flex;align-items:center;gap:8px;color:#101828}
.card h3{margin-bottom:12px}
.card h3:before,.panelHead h3:before{content:"";width:3px;height:14px;border-radius:2px;background:var(--green)}
.panelHead{min-height:24px;margin-bottom:12px}
.card>.tableWrap{margin:0 -16px -16px;border-top:1px solid var(--line)}
.card>h3+.tableWrap{margin-top:0}
table{font-size:13px}
th,td{padding:10px 12px;vertical-align:middle}
th:first-child,td:first-child{padding-left:16px}th:last-child,td:last-child{padding-right:16px}
th{font-size:12px;font-weight:600;color:#405124;background:#F6FAEF}
tbody tr:hover td{background:#FAFCF7}
tbody tr:last-child td{border-bottom:0}
.panel .taskTable{margin:0 -16px -16px;border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
code{font-size:12px;background:#F2F4F7;padding:2px 6px;border-radius:4px}
.status.gray{background:#F2F4F7;color:#475467}
td.wrapCell{white-space:normal;min-width:180px;max-width:320px;line-height:1.6}
.taskTable{margin-bottom:16px;overflow:auto}
.statRow,.grid.kpis,.kpis{gap:16px;margin-bottom:16px}
.kpi{min-height:0;padding:14px 16px}
.kpi:after{display:none}
.kpi .label{font-size:12px;margin-bottom:6px}.kpi .value{font-size:26px;font-weight:700}.kpi .note{margin-top:6px}
.statTile b{font-weight:700}
.status,.todoTag{border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600;line-height:1.6}
.segTabs{margin-bottom:16px}
.taskContext{margin:0 0 16px}
.filters{gap:12px}
.lcaStageTabs{gap:12px;margin-bottom:16px}
.lcaStageTabs button{border-radius:8px}
.modalBox{border-radius:10px}
.modalBox h2{font-size:18px;margin:0 0 10px}
.modalActions{gap:8px;align-items:center}
@media(max-width:1100px){.homeTop{grid-template-columns:1fr}.marketGrid{grid-template-columns:1fr}.newsWindow{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:8px}}
@media(max-width:760px){
  .content{padding:16px}
  .main,.sidebarCollapsed .main{background:none}
  .slide{grid-template-columns:1fr;min-height:0}
  .slideArt{height:140px;order:-1}
  .slideText{padding:18px 18px 44px}
  .slideNav{left:18px}
  .carousel{min-height:0}
  .taskCounts b{font-size:17px}
  .quoteFacts{grid-template-columns:repeat(2,1fr)}
  .card>.tableWrap{margin:0 -16px -16px}
}
/* 年度、目标、履约 */
#yearSelect{height:30px;border:1px solid #D0D5DD;border-radius:6px;padding:0 8px;background:#fff;color:#1F2937;font-size:13px;font-weight:600;margin-left:8px}
body.historyMode #yearSelect{border-color:#E9A23B;background:#FFF8EB;color:#8A5300}
.historyBanner{display:flex;align-items:center;gap:12px;background:#FFF8EB;border:1px solid #F5D9A8;border-radius:8px;padding:10px 14px;margin-bottom:16px}
.historyBanner div{flex:1;display:grid;gap:2px}.historyBanner small{color:#8A5300}
.goalStrip{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:16px;margin-bottom:16px}
.goalStrip>.panel{margin-bottom:0}
.goalList{display:grid;gap:8px}
.goalItem{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(80px,1fr) auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.goalItem.static{cursor:default}
.goalItem:not(.static):hover{border-color:#B9DB86;background:var(--greenSoft)}
.goalItem span:first-child{display:grid;gap:2px;min-width:0}.goalItem small{color:var(--sub);font-size:12px}
.goalTrack{height:8px;border-radius:4px;background:#EEF1F4;overflow:hidden}.goalTrack i{display:block;height:100%;background:var(--green);border-radius:4px}
.etsMini .etsMiniBody{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.countdown{display:flex;align-items:center;gap:8px;background:var(--greenSoft);border-radius:8px;padding:10px 14px}
.countdown b{font-size:30px;line-height:1;color:var(--green3)}.countdown span{font-size:12px;color:var(--sub);line-height:1.4}
.etsMini .miniFacts{flex:1;margin:0}
.okText{color:#26890D!important}.badText{color:#D92D20!important}
.targetCard .actions{display:flex;gap:8px}
.targetFacts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 14px}
.targetFacts div{background:#F8FAF5;border-radius:6px;padding:10px 12px}.targetFacts .wide{grid-column:1/-1}
.targetFacts dt{font-size:12px;color:var(--sub)}.targetFacts dd{margin:4px 0 0;font-weight:600}
.pathTable td:first-child{font-weight:600;white-space:nowrap}
.trackChart{width:100%;height:auto;display:block;margin:4px 0}
.chartLegend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-bottom:8px}
.chartLegend i{display:inline-block;width:18px;height:0;border-top:2.5px solid #26890D;vertical-align:middle;margin-right:6px}
.chartLegend i.dash{border-top:2px dashed #98A2B3}
.yearCompare{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:12px}
.yearCompare div{display:grid;gap:4px;background:#F8FAF5;border-radius:6px;padding:10px 12px}.yearCompare span{font-size:12px;color:var(--sub)}.yearCompare b{font-size:18px}
.yearBars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.yearBars button{display:grid;justify-items:center;gap:4px;border:1px solid transparent;background:none;border-radius:8px;padding:8px 4px;cursor:pointer;font:inherit}
.yearBars button.active{border-color:#C7E39C;background:var(--greenSoft)}
.yearBar{height:72px;width:28px;display:flex;align-items:flex-end;background:#F2F4F7;border-radius:4px;overflow:hidden}.yearBar i{display:block;width:100%;background:var(--green)}
.yearBars small{color:var(--sub)}
.etsSteps{margin:4px 0 14px}
.coverBar{height:10px;border-radius:5px;background:#EEF1F4;overflow:hidden;margin-bottom:8px}.coverBar span{display:block;height:100%;background:linear-gradient(90deg,#86BC25,#26890D)}
.planList{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.planList li{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.planList small{grid-column:1;color:var(--sub);font-size:12px}.planList .btn{grid-row:1/3;grid-column:2}

}

async function api(path,options={}){

const data=await res.json();
if(!res.ok||data.error)throw new Error(data.error||`HTTP ${res.status}`);
return data;
}

function setupInteractions(){
if(window.__deloitteInteractionsReady)return;
window.__deloitteInteractionsReady=true;
ensureUiLayer();
document.addEventListener("click",function(e){
  const close=e.target.closest("[data-close-modal]");
  if(close){closeModal();return}
  if(e.target.classList.contains("modalMask")){closeModal();return}
  const riskTab=e.target.closest(".riskTabs span");
  if(riskTab){riskTab.parentElement.querySelectorAll("span").forEach(i=>i.classList.remove("active"));riskTab.classList.add("active");showToast(`已切换到「${riskTab.textContent.trim()}」风险视图`);return}
  const standardTab=e.target.closest(".standardTabs button");
  if(standardTab){switchStandardTab(standardTab);return}
  const faq=e.target.closest(".faqItem");
  if(faq){toggleFaq(faq);return}
  const standard=e.target.closest(".standardItem");
  if(standard){openInfoModal("标准参考", standard.innerText);return}
  const message=e.target.closest(".messageItem");
  if(message){openInfoModal("消息详情", message.innerText);return}
  const btn=e.target.closest("button.btn");
  if(!btn)return;
  if(btn.onclick)return;
  const label=btn.textContent.trim();
  if(label==="查询"){simulateQuery(btn);return}
  if(label==="重置"){resetControls();return}
  if(label==="展开/收起"){toggleFilterPanels(btn);return}
  if(label==="新增/创建"){openCreateModal();return}
  if(label==="导出"){exportFirstTable();return}
  if(label==="查看"||label==="预览"||label==="下载"){openRowModal(label,btn);return}
  if(label==="编辑"||label==="修订"||label==="审核"||label==="上传"){openEditModal(label,btn);return}
  if(label==="删除"){deleteRow(btn);return}
});
document.addEventListener("input",function(e){
  if(e.target.closest(".helpSearch"))filterHelp(e.target.value);
});
}

function ensureUiLayer(){
if(document.getElementById("toast"))return;
document.body.insertAdjacentHTML("beforeend",`<div id="toast" class="toast" role="status"></div><div id="modalMask" class="modalMask" hidden><div class="modalBox"><button class="modalClose" data-close-modal="1">×</button><div id="modalContent"></div></div></div>`);
}

function showToast(text){
const toast=document.getElementById("toast");
toast.textContent=text;
toast.classList.add("show");
clearTimeout(window.__toastTimer);
window.__toastTimer=setTimeout(()=>toast.classList.remove("show"),2200);
}

function openModal(html){
document.getElementById("modalContent").innerHTML=html;
document.getElementById("modalMask").hidden=false;
}

function closeModal(){
document.getElementById("modalMask").hidden=true;
}

function textHtml(s){
return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
}

function currentTitle(){
return state.page===state.group?state.group:state.page;
}

function simulateQuery(btn){
const content=document.getElementById("content");
content.querySelectorAll("tbody tr").forEach((row,index)=>{
  row.classList.toggle("rowHighlight",index<2);
});
showToast(`已按当前条件查询「${currentTitle()}」，高亮展示前 2 条结果`);
}

function resetControls(){
const content=document.getElementById("content");
content.querySelectorAll("select").forEach(select=>select.selectedIndex=0);
content.querySelectorAll("input").forEach(input=>{if(!input.closest(".helpSearch"))input.value=""});
content.querySelectorAll("tbody tr").forEach(row=>{row.style.display="";row.classList.remove("rowHighlight")});
content.querySelectorAll(".filtersCollapsed").forEach(card=>card.classList.remove("filtersCollapsed"));
showToast("已重置当前页面筛选条件和临时高亮");
}

function toggleFilterPanels(btn){
const panels=[...document.querySelectorAll("#content .filters")].map(item=>item.closest(".card")||item);
if(!panels.length){showToast("当前页面没有可折叠的筛选区");return}
const collapsed=!panels[0].classList.contains("filtersCollapsed");
panels.forEach(panel=>panel.classList.toggle("filtersCollapsed",collapsed));
btn.classList.toggle("soft",!collapsed);
showToast(collapsed?"已收起高级筛选条件":"已展开高级筛选条件");
}

function openCreateModal(){
const title=currentTitle();
const fields=state.top==="产品碳排放"
  ?["模型/产品名称","产品类型","标准依据","系统边界说明"]
  :state.top==="供应链碳排放"
  ?["供应商名称","采购件名称","提交截止日期","协同说明"]
  :state.top==="基础配置"
  ?["配置名称","适用范围","版本","说明"]
  :["任务/资料名称","所属组织","责任人","说明"];
openModal(`<h2>新增/创建 - ${textHtml(title)}</h2><div class="modalForm">${fields.map((field,index)=>`<label>${field}${index===fields.length-1?`<textarea placeholder="请输入${field}"></textarea>`:`<input placeholder="请输入${field}" />`}</label>`).join("")}</div><div class="modalActions"><button class="btn" data-close-modal="1">取消</button><button class="btn primary" onclick="showToast('草稿已保存');closeModal()">保存草稿</button></div>`);
}

function rowData(btn){
const row=btn.closest("tr");
if(!row)return {title:currentTitle(),headers:[],values:[]};
const table=row.closest("table");
const headers=[...table.querySelectorAll("thead th")].map(th=>th.textContent.trim());
const values=[...row.children].map(td=>td.innerText.trim());
return {title:table.closest(".card")?.querySelector("h3")?.textContent.trim()||currentTitle(),headers,values,row};
}

function openRowModal(action,btn){
const data=rowData(btn);
const pairs=data.headers.map((h,i)=>`<tr><th>${textHtml(h)}</th><td>${textHtml(data.values[i]||"")}</td></tr>`).join("");
openModal(`<h2>${action} - ${textHtml(data.title)}</h2><div class="tableWrap"><table><tbody>${pairs}</tbody></table></div><div class="modalActions"><button class="btn" data-close-modal="1">关闭</button><button class="btn primary" onclick="showToast('${action}内容已加入预览');closeModal()">${action}</button></div>`);
}

function openEditModal(action,btn){
const data=rowData(btn);
const editable=data.headers.slice(0,Math.min(4,data.headers.length)).map((h,i)=>`<label>${textHtml(h)}<input value="${textHtml(data.values[i]||"")}" /></label>`).join("");
openModal(`<h2>${action} - ${textHtml(data.title)}</h2><div class="modalForm">${editable}<label>处理说明<textarea>已根据当前页面场景生成${action}表单。</textarea></label></div><div class="modalActions"><button class="btn" data-close-modal="1">取消</button><button class="btn primary" onclick="showToast('${action}已完成');closeModal()">确认</button></div>`);
}

function deleteRow(btn){
const row=btn.closest("tr");
if(!row)return;
row.classList.add("rowRemoving");
setTimeout(()=>row.remove(),180);
showToast("已删除该行");
}

function exportFirstTable(){
const table=document.querySelector("#content table");
if(!table){showToast("当前页面没有可导出的表格");return}
const rows=[...table.querySelectorAll("tr")].map(tr=>[...tr.children].map(cell=>`"${cell.innerText.replace(/"/g,'""')}"`).join(",")).join("\n");
const blob=new Blob(["\ufeff"+rows],{type:"text/csv;charset=utf-8"});
const a=document.createElement("a");
a.href=URL.createObjectURL(blob);
a.download=`${currentTitle()}-${new Date().toISOString().slice(0,10)}.csv`;

function demoCalculate(standardCode, org, period) {
  const standard = demo.standards.find(row => row.code === standardCode);
  const matches = row => (!org || row.org === org) && (!period || row.period === period);
  const detail = demo.records.filter(matches).flatMap(row => {
    const factor = demo.factors.find(item => item.id === row.factor_id);
    const gwp = demo.gwp.find(item => item.standard_code === standardCode && item.gas === row.gas && Number(item.horizon) === 100);
    if (!factor || !gwp) return [];
    return [{...row, factor_value: factor.factor_value, gwp_value: gwp.value,
      standard_adjustment: standard.adjustment, emission_tco2e: row.activity_value * factor.factor_value * gwp.value * standard.adjustment}];
  });
  if (matches({org: demoOrg, period: demoPeriod})) {
    detail.push(...supplyScope3Items.filter(row => row.status === "已收集").map(row => ({
      org: demoOrg, period: demoPeriod, category_code: row.category, source_name: row.supplier + " / " + row.part,
      activity_value: row.qty, activity_unit: row.unit, factor_value: row.unitCarbon / 1000,
      gwp_value: 1, standard_adjustment: 1, emission_tco2e: row.total
    })));
  }
  const total_emission = detail.reduce((sum, row) => sum + row.emission_tco2e, 0);
  const categories = demo.categories.flatMap(category => {
    const rows = detail.filter(row => row.category_code === category.code);
    if (!rows.length) return [];
    const emission_tco2e = rows.reduce((sum, row) => sum + row.emission_tco2e, 0);
    return [{category_code: category.code, category_name: category.name,
      emission_tco2e: +emission_tco2e.toFixed(4), share: total_emission ? +(emission_tco2e / total_emission * 100).toFixed(2) : 0}];
  });
  return {standard, total_emission: +total_emission.toFixed(4), categories, detail};
}

api = async function (path, options = {}) {
  const url = new URL(path, "https://demo.invalid");
  const name = url.pathname.split("/").pop();
  if (name === "bootstrap") return demo;
  if (name === "calculate") {
    return demoCalculate(url.searchParams.get("standard"), url.searchParams.get("org"), url.searchParams.get("period"));
  }
  const row = JSON.parse(options.body || "{}");
  const collection = demo[name];
  if (options.method !== "POST" || !Array.isArray(collection)) throw new Error("该操作暂不支持");
  let report;
  if (name === "records") {
    const source = demo.sources.find(item => item.id === row.source_id);
    if (!source || !String(row.activity_value).trim() || !Number.isFinite(+row.activity_value) || +row.activity_value < 0) {
      throw new Error("请选择排放源并填写有效的活动数据");
    }
    Object.assign(row, {factor_id: source.default_factor_id, source_name: source.name, activity_value: +row.activity_value});
  }
  if (name === "reports") {
    report = demoCalculate(row.standard_code, row.org, row.period);
    row.total_emission = report.total_emission;
    row.content_json = JSON.stringify(report);
  }
  if (name === "formulas") row.enabled = 1;
  if (name === "factors") row.year = 2026;
  const existing = name === "substances" && collection.find(item => item.gas === row.gas);
  row.id = existing ? existing.id : Math.max(0, ...collection.map(item => item.id)) + 1;
  row.created_at = new Date().toISOString();
  if (existing) Object.assign(existing, row);
  else collection.unshift(row);
  persistDemo();
  return {ok: true, id: row.id, report};
};

function lineEmission(model,line) {
  return Number(line.quantity) * Number(line.factor) * Number(line.allocation) / 100 / model.batchOutput * model.referenceFlow;
}
function lcaTotals(model) {
  return model.stages.map(stage=>({
    name:stage.name, enabled:stage.enabled,
    total:stage.enabled ? stage.lines.reduce((sum,line)=>sum+lineEmission(model,line),0) : 0
  }));
}
function lcaTotal(model) {
  return lcaTotals(model).reduce((sum,stage)=>sum+stage.total,0);
}

function saveLcaModel() {

function taskPreviewText(activity,factor) {
  if(activity===""||activity===undefined||!Number.isFinite(+activity))return "录入活动量后自动计算排放";

function previewTaskEmission(factor) {
  const element=document.getElementById("taskPreview");
  if(element)element.innerHTML=taskPreviewText(document.getElementById("taskActivity").value,factor);

function readTaskAttachment(input) {
  const file=input.files[0];
  if(!file)return;
  if(file.size>3*1024*1024){showToast("请选择 3 MB 以内的凭证文件");input.value="";return;}
  const reader=new FileReader();
  reader.onload=()=>{
    uploadedTaskEvidence={name:file.name,data:reader.result};
    document.getElementById("taskAttachmentLabel").textContent=file.name;
    if(!document.getElementById("taskEvidence").value)document.getElementById("taskEvidence").value=file.name;
  };
  reader.readAsDataURL(file);
}

async function saveUnifiedTask(submit) {
  const task=workflowTasks().find(row=>row.id===openTaskId);
  const old=taskEntry(task);
  if(task.locked||["通过","待审核"].includes(old.status))return;
  const value=document.getElementById("taskActivity").value;
  const evidence=document.getElementById("taskEvidence").value.trim();
  if(value===""||!Number.isFinite(+value)||+value<0||(submit&&!evidence)){showToast("请填写有效活动量，提交时需填写凭证编号或上传文件");return;}
  demo.taskEntries[task.id]={...old,activity:+value,evidence,note:document.getElementById("taskNote").value,
    status:submit?"待审核":"草稿",attachment:uploadedTaskEvidence,reviewNote:""};
  auditTask(task.id,submit?"提交审核":"保存草稿");
  persistDemo();await loadBackendData();closeModal();render();showToast(submit?"任务已提交审核":"草稿已保存");
}
async function reviewUnifiedTask(approved) {
  if(currentRole!=="管理者"){showToast("请切换管理者进行审核");return;}
  const entry=demo.taskEntries[openTaskId];
  if(!entry||entry.status!=="待审核")return;
  const note=document.getElementById("taskReviewNote").value.trim();
  if(!approved&&!note){showToast("请填写退回原因");return;}
  entry.status=approved?"通过":"退回";
  entry.reviewNote=note;
  auditTask(openTaskId,approved?"审核通过":"退回："+note);
  persistDemo();await loadBackendData();closeModal();render();showToast(approved?"已审核并更新核算":"已退回填报人");
}

  result.detail=result.detail.filter(row=>row.id!==undefined && taskEntry({id:"REC-"+row.id}).status==="通过");
  if((!org||org===demoOrg)&&(!period||period===demoPeriod)) {
    Object.values(demo.approvedSuppliers).forEach(row=>result.detail.push({
      scope:"3",org:demoOrg,period:demoPeriod,category_code:row.category,
      source_name:row.supplier+" / "+row.part,activity_value:row.qty,activity_unit:row.unit,
      factor_value:row.unitCarbon/1000,gwp_value:1,emission_tco2e:row.total,evidence:row.evidence
    }));
  }
  result.detail.forEach(row=>{
    if(row.id!==undefined) {
      const entry=demo.taskEntries["REC-"+row.id];
      if(entry) {
        row.activity_value=entry.activity;
        row.evidence=entry.evidence;
        row.emission_tco2e=entry.activity*row.factor_value*row.gwp_value;
      }
    }
    row.scope="3";
  });
  if((!org||org===demoOrg)&&(!period||period===demoPeriod)) {
    workflowTasks().filter(task=>!task.locked&&!task.id.startsWith("REC-")).forEach(task=>{
      const entry=taskEntry(task);
      if(entry.status==="通过")result.detail.push({
        scope:task.scope,category_code:task.scope==="3"?task.category:"S"+task.scope,category_name:"范围"+task.scope,
        source_name:task.name,activity_value:entry.activity,activity_unit:task.unit,factor_value:task.factor,
        gwp_value:1,period:task.period,org:task.org,emission_tco2e:entry.activity*task.factor,evidence:entry.evidence
      });
    });
  }
  result.total_emission=result.detail.reduce((sum,row)=>sum+row.emission_tco2e,0);
  result.categories=[...new Set(result.detail.map(row=>row.category_code))].map(code=>{
    const entries=result.detail.filter(row=>row.category_code===code);
    const amount=entries.reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {category_code:code,category_name:code==="S1"?"范围一":code==="S2"?"范围二":categoryName(code),
      emission_tco2e:amount,share:result.total_emission?+(amount/result.total_emission*100).toFixed(2):0};
  });
  return result;
};

function lifecycleSankey(model) {
  const totals=lcaTotals(model);
  const total=lcaTotal(model);
  if(!total)return '<div class="emptyState">录入生命周期活动数据后生成桑基图。</div>';
  const colors=["#86bc25","#008a7a","#2c6aa0","#d59326","#8b729c"];
  const activities=model.stages.flatMap((stage,stageIndex)=>stage.enabled?stage.lines.map(line=>({
    name:line.name,value:lineEmission(model,line),stageIndex
  })):[]).sort((a,b)=>b.value-a.value);
  const hot=activities.slice(0,4);
  const remaining=activities.slice(4).reduce((sum,row)=>sum+row.value,0);
  if(remaining>0)hot.push({name:"其他活动",value:remaining,stageIndex:-1});
  const scale=230/total;
  let inOffset=0;
  let outOffset=0;
  let leftPosition=55;
  let rightPosition=55;
  const sources=totals.map((stage,index)=>{
    const width=stage.total*scale;
    const y=leftPosition+Math.max(36,width)/2;
    leftPosition+=Math.max(36,width)+8;
    const targetY=135+inOffset+width/2;
    inOffset+=width;
    return '<g class="sankeyItem" role="button" tabindex="0" aria-label="'+stage.name+
      '阶段明细" onclick="showLcaStageDetail('+index+')" onkeydown="if(event.key===\'Enter\')showLcaStageDetail('+index+')">'+
      '<path d="M 246 '+y+' C 355 '+y+' 390 '+targetY+' 488 '+targetY+
      '" fill="none" stroke="'+colors[index]+'" stroke-opacity=".48" stroke-width="'+width+'"/>'+
      '<path d="M 246 '+y+' C 355 '+y+' 390 '+targetY+' 488 '+targetY+'" fill="none" stroke="transparent" stroke-width="18"/>'+
      '<rect x="230" y="'+(y-Math.max(3,width)/2)+'" width="12" height="'+Math.max(3,width)+'" rx="2" fill="'+colors[index]+'"/>'+
      '<text x="16" y="'+(y-5)+'">'+stage.name+'</text><text class="sankeyValue" x="16" y="'+(y+15)+'">'+
      formatEmission(stage.total)+' kgCO₂e · '+(stage.total/total*100).toFixed(2)+'%</text></g>';
  }).join("");
  const targets=hot.map((activity,index)=>{
    const width=activity.value*scale;
    const y=rightPosition+Math.max(36,width)/2;
    rightPosition+=Math.max(36,width)+8;
    const startY=135+outOffset+width/2;

function moveCarousel(step,absolute=false) {

function reportScopeRows(detail) {
  const total=detail.reduce((sum,row)=>sum+row.emission_tco2e,0);
  return {total,scopes:["1","2","3"].map(scope=>{
    const value=detail.filter(row=>String(row.scope)===scope).reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {scope,label:["","范围一 直接排放","范围二 外购能源间接排放","范围三 价值链间接排放"][scope],value,share:total?value/total*100:0};
  }),categories:[...new Set(detail.filter(row=>String(row.scope)==="3").map(row=>row.category_code))].map(code=>{
    const value=detail.filter(row=>row.category_code===code).reduce((sum,row)=>sum+row.emission_tco2e,0);
    return {code,name:categoryName(code),value,share:total?value/total*100:0};
  }).sort((a,b)=>b.value-a.value)};
}

const PART_SUPPLIERS = [["铸铁","苏州恒铸精密铸造"],["电工钢","常州鑫叠电机材料"],["铜","无锡华导铜业"]];
function partSupplier(line) {
  const match=PART_SUPPLIERS.find(([key])=>line.name.includes(key));
  if(!match)return null;
  const row=supplyScope3Items.find(item=>item.supplier===match[1]);
  return row?{row,approved:demo.approvedSuppliers[row.id]}:null;
}
function lineTable(heads,rows) {
  return '<div class="taskTable tableWrap"><table><thead><tr>'+heads.map(head=>'<th>'+head+'</th>').join("")+'</tr></thead><tbody>'+
    (rows.length?rows.join(""):'<tr><td colspan="'+heads.length+'" class="emptyCell">暂无数据</td></tr>')+'</tbody></table></div>';
}
async function adoptSupplierFactor(index) {
  if(currentRole!=="管理者"){showToast("由管理者确认是否采用供应商数据");return;}
  const model=activeLca();
  const line=model.stages[0].lines[index];
  const link=partSupplier(line);
  if(!link?.approved)return;
  line.factor=link.approved.unitCarbon;
  line.source=link.row.supplier+" 已批准数据 V"+((demo.supplierVersionHistory[link.row.id]||[]).length||1);
  line.evidence=link.approved.evidence;
  line.quality="供应商数据";
  persistDemo();render();
  showToast("已采用供应商数据，产品碳足迹已重新计算");
}
const productDataBeforeRoles = productData;
productData = function () {
  const model=activeLca();
  const materials=model.stages[0].lines;
  if(state.page==="BOM/物料清单") {
    return lcaHeading("BOM/物料清单")+'<div class="taskContext"><span>'+textHtml(model.name)+'</span><span>'+textHtml(model.code)+'</span><span>批次产量 '+model.batchOutput+' '+textHtml(model.flowUnit)+'</span></div>'+
      lineTable(["层级","物料","单台用量","批次用量","来源","凭证","操作"],materials.map((line,index)=>'<tr><td>1.'+(index+1)+'</td><td><strong>'+textHtml(line.name)+'</strong></td><td>'+
        fmt(line.quantity/model.batchOutput,3)+' '+textHtml(line.unit)+'</td><td>'+fmt(line.quantity,2)+' '+textHtml(line.unit)+'</td><td>'+textHtml(line.source)+'</td><td>'+textHtml(line.evidence)+
        '</td><td><button class="btn" onclick="activeLcaStage=0;editLcaLine('+index+')">编辑用量</button></td></tr>'));

  if(state.page==="零部件碳排数据") {
    return lcaHeading("零部件碳排数据")+'<div class="taskContext"><span>关键物料的单位碳排可直接采用供应商已批准数据，替代行业估算值</span></div>'+
      lineTable(["物料","模型采用因子(kgCO₂e)","数据类型","对应供应商","供应商已批准因子","差异","操作"],materials.map((line,index)=>{
        const link=partSupplier(line);
        const approved=link?.approved;
        const diff=approved?(approved.unitCarbon-line.factor)/line.factor*100:null;
        const same=approved&&Number(approved.unitCarbon)===Number(line.factor);
        return '<tr><td><strong>'+textHtml(line.name)+'</strong><small>'+textHtml(line.source)+'</small></td><td>'+line.factor+' / '+textHtml(line.unit)+'</td><td>'+textHtml(line.quality||"—")+

          '</td><td>'+(diff===null?'—':(diff>0?'+':'')+diff.toFixed(1)+'%')+'</td><td>'+(approved&&!same?'<button class="btn primary" onclick="adoptSupplierFactor('+index+')">采用供应商数据</button>':
          same?'<span class="status ok">已采用</span>':'<button class="btn" onclick="activeLcaStage=0;editLcaLine('+index+')">维护因子</button>')+'</td></tr>';
      }));

    const rows=model.stages.slice(1).flatMap((stage,offset)=>stage.lines.map((line,index)=>({stage,stageIndex:offset+1,line,index})));
    return lcaHeading("额外活动因子库")+'<div class="taskContext"><span>制造、运输、使用和回收阶段的能源与活动因子</span></div>'+
      lineTable(["阶段","活动","活动单位","因子(kgCO₂e/单位)","来源","代表年份","地域","操作"],rows.map(({stage,stageIndex,line,index})=>'<tr><td>'+stage.name+'</td><td><strong>'+textHtml(line.name)+
        '</strong></td><td>'+textHtml(line.unit)+'</td><td>'+line.factor+'</td><td>'+textHtml(line.source)+'</td><td>'+line.year+'</td><td>'+textHtml(line.region)+
        '</td><td><button class="btn" onclick="activeLcaStage='+stageIndex+';editLcaLine('+index+')">维护</button></td></tr>'));
  }
  return productDataBeforeRoles();
